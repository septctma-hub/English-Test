/* ------------------------------ EVENT WIRING ------------------------------ */
function wireEvents(){
  if(S.screen==='auth'){
    document.querySelectorAll('[data-role]').forEach(b=> b.onclick = ()=>{ S.role=b.dataset.role; render(); });
    document.getElementById('forgot-btn').onclick = ()=> toast('Se enviaría un enlace de recuperación al correo registrado (demo).');
    document.getElementById('auth-form').onsubmit = async (e)=>{
      e.preventDefault();
      const name = document.getElementById('f-name').value.trim();
      const email = document.getElementById('f-email').value.trim();
      const pass = document.getElementById('f-pass').value;
      if(!name || !email || !pass){ S.authError='Por favor completa todos los campos.'; render(); return; }
      if(!email.includes('@')){ S.authError='Ingresa un correo válido.'; render(); return; }
      S.authError='';
      S.user = {name, email, id: email.split('@')[0].toUpperCase()};
      if(S.role==='student'){
        let existing = await loadTest(email);
        if(!existing) existing = makeEmptyTest(S.user);
        S.test = existing;
        if(!existing.presentationSeen) S.screen='presentation';
        else { S.activeSection = defaultSection(); S.activeSkill=null; S.subView=false; S.screen='section'; }
        await saveTest();
      } else {
        S.instructorList = await loadAllStudents();
        S.screen = 'instructor';
      }
      render();
    };
    return;
  }

  // reiniciar prueba (modo prueba)
  const rt = document.getElementById('reset-test-btn');
  if(rt) rt.onclick = async ()=>{
    if(confirm('¿Reiniciar tu prueba? Se borrarán tus respuestas, el audio y el progreso de este estudiante.')) await resetMyTest();
  };

  // logout
  const lo = document.getElementById('logout-btn');
  if(lo) lo.onclick = ()=>{ S = {...S, screen:'auth', user:null, test:null, authError:''}; render(); };

  if(S.role==='instructor'){
    document.querySelectorAll('[data-view-student]').forEach(b=>{
      b.onclick = ()=>{
        S.instructorSelected = S.instructorList.find(t=>t.studentEmail===b.dataset.viewStudent);
        S.screen='instructor-detail'; render();
      };
    });
    const back = document.getElementById('back-to-dashboard');
    if(back) back.onclick = ()=>{ S.screen='instructor'; S.instructorSelected=null; render(); };

    document.querySelectorAll('[data-teacher-writing-check]').forEach(el=>{
      el.onchange = ()=>{ const [email,tid,k]=el.dataset.teacherWritingCheck.split('|'); S.instructorSelected.writing[tid].teacherChecklist[k]=el.checked; };
    });
    document.querySelectorAll('[data-teacher-writing-score]').forEach(el=>{
      el.onchange = ()=>{ const [email,tid]=el.dataset.teacherWritingScore.split('|'); S.instructorSelected.writing[tid]._pendingScore = clamp(parseInt(el.value||'0'),0,100); };
    });
    document.querySelectorAll('[data-teacher-writing-comment]').forEach(el=>{
      el.onchange = ()=>{ const [email,tid]=el.dataset.teacherWritingComment.split('|'); S.instructorSelected.writing[tid]._pendingComment = el.value; };
    });
    document.querySelectorAll('[data-teacher-speaking-check]').forEach(el=>{
      el.onchange = ()=>{ const [email,tid,i]=el.dataset.teacherSpeakingCheck.split('|'); S.instructorSelected.speaking[tid].teacherChecklist[i]=el.checked; };
    });
    document.querySelectorAll('[data-teacher-speaking-score]').forEach(el=>{
      el.onchange = ()=>{ const [email,tid]=el.dataset.teacherSpeakingScore.split('|'); S.instructorSelected.speaking[tid]._pendingScore = clamp(parseInt(el.value||'0'),0,100); };
    });
    document.querySelectorAll('[data-teacher-speaking-comment]').forEach(el=>{
      el.onchange = ()=>{ const [email,tid]=el.dataset.teacherSpeakingComment.split('|'); S.instructorSelected.speaking[tid]._pendingComment = el.value; };
    });

    const saveEval = document.getElementById('save-eval-btn');
    if(saveEval) saveEval.onclick = async ()=>{
      const t = S.instructorSelected;
      CONTENT.writing.forEach(def=>{
        const rec = t.writing[def.id];
        if(rec._pendingScore!==undefined) rec.teacherScore = rec._pendingScore;
        if(rec._pendingComment!==undefined) rec.teacherComment = rec._pendingComment;
      });
      CONTENT.speaking.forEach(def=>{
        const rec = t.speaking[def.id];
        if(rec._pendingScore!==undefined) rec.teacherScore = rec._pendingScore;
        if(rec._pendingComment!==undefined) rec.teacherComment = rec._pendingComment;
      });
      try{ await window.storage.set('student:'+t.studentEmail, JSON.stringify(t), true); toast('Evaluación guardada.'); }
      catch(e){ toast('No se pudo guardar. Intenta de nuevo.'); }
      render();
    };
    const finalizeBtn = document.getElementById('finalize-btn');
    if(finalizeBtn) finalizeBtn.onclick = async ()=>{
      const t = S.instructorSelected;
      if(!withTest(t, testEnded)){ toast('El estudiante aún no termina su recorrido.'); return; }
      if(!allGradedFor(t)){ toast('Completa las evaluaciones de Writing y Speaking de todas las secciones que realizó el estudiante antes de finalizar.'); return; }
      t.status='finalized';
      try{ await window.storage.set('student:'+t.studentEmail, JSON.stringify(t), true); toast('Reporte finalizado.'); }
      catch(e){}
      render();
    };
    return;
  }

  // ---- student navigation ----
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{
      const key = b.dataset.nav;
      if(key==='presentation'){ S.screen='presentation'; }
      else if(key==='results'){ S.screen='results'; }
      else if(/^sec[0-9]+$/.test(key)){
        const n = parseInt(key.slice(3));
        if(!sectionUnlocked(n)) return;
        S.activeSection=n; S.activeSkill=null; S.activeSub=n-1; S.subView=false; S.screen='section';
      }
      render();
    };
  });

  const startBtn = document.getElementById('start-test-btn');
  if(startBtn) startBtn.onclick = async ()=>{
    S.test.presentationSeen = true;
    S.activeSection=1; S.activeSkill=null; S.activeSub=0; S.subView=false; S.screen='section';
    await saveTest();
    render();
    toast('Examen iniciado. ¡Buena suerte!');
  };

  document.querySelectorAll('[data-open-skill]').forEach(b=>{
    b.onclick = ()=>{
      if(!sectionUnlocked(S.activeSection) || sectionSkillLocked(b.dataset.openSkill, S.activeSection)) return;
      S.activeSkill = b.dataset.openSkill; S.activeSub = S.activeSection-1; S.subView = true; render();
    };
  });

  const sidebarToggle = document.getElementById('sidebar-toggle-btn');
  if(sidebarToggle) sidebarToggle.onclick = ()=>{ S.sidebarCollapsed = !S.sidebarCollapsed; render(); };

  const backOverviewBtn = document.getElementById('back-to-overview');
  if(backOverviewBtn) backOverviewBtn.onclick = ()=>{ S.subView = false; S.activeSkill = null; render(); };

  // índice de preguntas (Reading/Listening): clic → abre el panel de la pregunta en la columna derecha
  document.querySelectorAll('[data-q-modal-open]').forEach(b=>{
    b.onclick = ()=>{
      const [kind, subId, qi] = b.dataset.qModalOpen.split('|');
      S.qModal = { kind, subId, qi: parseInt(qi) };
      render();
    };
  });

  // panel de pregunta: cerrar y navegación Anterior/Siguiente
  const qFocusClose = document.getElementById('q-focus-close');
  if(qFocusClose) qFocusClose.onclick = ()=>{ S.qModal = null; render(); };
  document.querySelectorAll('[data-modal-nav]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.modalNav==='' || b.disabled) return;
      if(b.dataset.modalNav==='close'){ S.qModal = null; render(); return; }   // última pregunta: vuelve al listado (ahí está el botón de enviar)
      const qi = parseInt(b.dataset.modalNav);
      const skillKey = S.qModal.kind==='read' ? 'reading' : 'listening';
      const def = CONTENT[skillKey].find(d=>d.id===S.qModal.subId);
      const ra = def && def.questions[qi] && def.questions[qi].ra;
      if(ra){ (S.qModal.kind==='read' ? S.readingActiveRA : S.listeningActiveRA)[S.qModal.subId] = ra; }  // mantiene la pestaña de tarea sincronizada
      S.qModal = { ...S.qModal, qi };
      render();
    };
  });

  // botones Section 1 / Section 2 (filtro por RA)
  document.querySelectorAll('[data-section-select]').forEach(b=>{
    b.onclick = ()=>{
      const [kind, subId, ra] = b.dataset.sectionSelect.split('|');
      if(kind==='read') S.readingActiveRA[subId] = ra;
      if(kind==='listen') S.listeningActiveRA[subId] = ra;
      render();
    };
  });

  // reading answers
  document.querySelectorAll('[data-read-answer]').forEach(el=>{
    el.onchange = ()=>{
      const [subId, qi] = el.dataset.readAnswer.split('|');
      S.test.reading[subId].answers[qi] = parseInt(el.value);
    };
  });
  // Reading: colocar palabras del banco en los huecos del texto.
  // Se usan eventos de puntero (no el arrastre nativo HTML5): funciona igual con
  // ratón, dedo o lápiz y en cualquier navegador. También: tocar palabra y luego hueco.
  (function wireGapDrag(){
    const place = (subId, qi, word)=>{
      const rec = S.test.reading[subId]; if(rec.completed) return;
      const def = CONTENT.reading.find(d=>d.id===subId), ps = gapPassage(def);
      const total = ps.wordBank.filter(w=>w===word).length;
      if(gapUsedCount(def, rec, word, qi) >= total){ toast('Esa palabra ya está colocada. Toca un espacio para devolverla al banco.'); return; }
      rec.answers[qi] = word; S.gapSel = null; saveTest(); renderKeepScroll();
    };
    const clear = (subId, qi)=>{ const rec=S.test.reading[subId]; if(rec.completed) return; delete rec.answers[qi]; saveTest(); renderKeepScroll(); };
    const swap = (subId, from, to)=>{
      const rec = S.test.reading[subId]; if(rec.completed || from===to) return;
      const a = rec.answers[from], b = rec.answers[to];
      rec.answers[to] = a; if(b) rec.answers[from] = b; else delete rec.answers[from];
      saveTest(); renderKeepScroll();
    };
    const slotAt = (x,y)=>{ const el=document.elementFromPoint(x,y); return el && el.closest ? el.closest('[data-gap-slot]') : null; };
    const bankAt = (x,y)=>{ const el=document.elementFromPoint(x,y); return el && el.closest ? el.closest('[data-gap-bank]') : null; };

    let st = null;   // arrastre en curso
    const THRESH = 6;
    function onMove(e){
      if(!st) return;
      if(!st.moved && Math.hypot(e.clientX-st.x0, e.clientY-st.y0) < THRESH) return;
      if(!st.moved){
        st.moved = true;
        st.ghost = document.createElement('div');
        st.ghost.className = 'gap-ghost'; st.ghost.textContent = st.word;
        document.body.appendChild(st.ghost);
      }
      if(e.cancelable) e.preventDefault();
      st.ghost.style.left = e.clientX+'px'; st.ghost.style.top = e.clientY+'px';
      document.querySelectorAll('.gap-slot.drag-over').forEach(x=>x.classList.remove('drag-over'));
      const sl = slotAt(e.clientX, e.clientY);
      if(sl && sl.dataset.gapSlot.split('|')[0]===st.subId) sl.classList.add('drag-over');
    }
    function endDrag(e, cancelled){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
      const cur = st; st = null;
      if(!cur) return;
      if(cur.ghost) cur.ghost.remove();
      document.querySelectorAll('.gap-slot.drag-over').forEach(x=>x.classList.remove('drag-over'));
      if(!cur.moved){
        // sin movimiento = toque: una ficha se selecciona/deselecciona; una palabra colocada la maneja el clic del hueco
        if(!cancelled && cur.type==='chip'){
          S.gapSel = (S.gapSel && S.gapSel.subId===cur.subId && S.gapSel.word===cur.word) ? null : {subId:cur.subId, word:cur.word};
          renderKeepScroll();
        }
        return;
      }
      S.gapSuppressClick = Date.now()+80;             // evita que el clic final del arrastre vuelva a disparar acciones
      if(cancelled) return;
      const sl = slotAt(e.clientX, e.clientY);
      if(sl && sl.dataset.gapSlot.split('|')[0]===cur.subId){
        const qi = parseInt(sl.dataset.gapSlot.split('|')[1]);
        if(cur.type==='chip') place(cur.subId, qi, cur.word); else swap(cur.subId, cur.qi, qi);
        return;
      }
      if(cur.type==='gap' && bankAt(e.clientX, e.clientY)) clear(cur.subId, cur.qi);   // soltar sobre el banco = devolver la palabra
    }
    function onUp(e){ endDrag(e,false); }
    function onCancel(e){ endDrag(e,true); }
    function begin(e, info){
      if(e.button!==undefined && e.button!==0) return;
      st = {...info, x0:e.clientX, y0:e.clientY, moved:false};
      document.addEventListener('pointermove', onMove, {passive:false});
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancel);
    }
    document.querySelectorAll('[data-gap-chip]').forEach(el=>{
      const [subId, word] = el.dataset.gapChip.split('|');
      el.addEventListener('pointerdown', e=> begin(e, {type:'chip', subId, word}));
    });
    document.querySelectorAll('[data-gap-word]').forEach(el=>{
      const [subId, qi] = el.dataset.gapWord.split('|');
      const word = S.test.reading[subId].answers[parseInt(qi)];
      el.addEventListener('pointerdown', e=> begin(e, {type:'gap', subId, qi:parseInt(qi), word}));
    });
    document.querySelectorAll('[data-gap-slot]').forEach(el=>{
      const [subId, qiS] = el.dataset.gapSlot.split('|'); const qi = parseInt(qiS);
      el.addEventListener('click', ()=>{
        if(S.gapSuppressClick && Date.now() < S.gapSuppressClick) return;
        const rec = S.test.reading[subId];
        if(S.gapSel && S.gapSel.subId===subId){ place(subId, qi, S.gapSel.word); return; }
        if(rec.answers[qi]) clear(subId, qi);       // tocar una palabra colocada la devuelve al banco
      });
    });
  })();
  document.querySelectorAll('[data-read-text-answer]').forEach(el=>{
    el.oninput = ()=>{
      const [subId, qi] = el.dataset.readTextAnswer.split('|');
      S.test.reading[subId].answers[qi] = el.value;
    };
  });
  // drag & drop de ordenamiento (preguntas type:'order', reading y listening)
  document.querySelectorAll('[data-order-list]').forEach(list=>{
    const [kind, subId, qi] = list.dataset.orderList.split('|');
    const skillKey = kind==='read' ? 'reading' : 'listening';
    const rec = S.test[skillKey][subId];
    const def = CONTENT[skillKey].find(s=>s.id===subId);
    const q = def.questions[parseInt(qi)];
    if(rec.completed) return; // ya enviado: no se puede arrastrar
    let dragSrcPos = null;
    list.querySelectorAll('.order-item').forEach(item=>{
      item.addEventListener('dragstart', ()=>{
        dragSrcPos = parseInt(item.dataset.orderPos);
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', ()=>{
        item.classList.remove('dragging');
        list.querySelectorAll('.order-item').forEach(li=>li.classList.remove('drag-over'));
      });
      item.addEventListener('dragover', (e)=>{
        e.preventDefault();
        item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', ()=> item.classList.remove('drag-over'));
      item.addEventListener('drop', (e)=>{
        e.preventDefault();
        item.classList.remove('drag-over');
        const targetPos = parseInt(item.dataset.orderPos);
        if(dragSrcPos===null || dragSrcPos===targetPos) return;
        const order = Array.isArray(rec.answers[qi]) ? [...rec.answers[qi]] : q.items.map((_,idx)=>idx);
        const [moved] = order.splice(dragSrcPos,1);
        order.splice(targetPos,0,moved);
        rec.answers[qi] = order;
        dragSrcPos = null;
        renderKeepScroll();
      });
    });
  });
  document.querySelectorAll('[data-submit-reading]').forEach(b=>{
    b.onclick = async ()=>{
      const subId = b.dataset.submitReading;
      S.test.reading[subId].completed = true;
      S.test.reading[subId].score = readingListeningScore('reading', subId);
      S.test.reading[subId].raPass = subsectionRAPassed('reading', subId);
      await saveTest(); render();
      toast((S.test.reading[subId].raPass===false
        ? 'Reading enviado. No alcanzaste el mínimo requerido: Writing y Speaking de esta sección quedan bloqueados y la prueba se detiene aquí.'
        : 'Reading enviado y calificado automáticamente.') + (TEST_MODE ? scoreBreakdownText('reading', subId) : ''), TEST_MODE ? 9000 : 2400);
    };
  });

  // listening answers
  document.querySelectorAll('[data-listen-answer]').forEach(el=>{
    el.onchange = ()=>{
      const [subId, qi] = el.dataset.listenAnswer.split('|');
      S.test.listening[subId].answers[qi] = parseInt(el.value);
    };
  });
  document.querySelectorAll('[data-listen-text-answer]').forEach(el=>{
    el.oninput = ()=>{
      const [subId, qi] = el.dataset.listenTextAnswer.split('|');
      S.test.listening[subId].answers[qi] = el.value;
    };
  });
  document.querySelectorAll('[data-submit-listening]').forEach(b=>{
    b.onclick = async ()=>{
      const subId = b.dataset.submitListening;
      S.test.listening[subId].completed = true;
      S.test.listening[subId].score = readingListeningScore('listening', subId);
      S.test.listening[subId].raPass = subsectionRAPassed('listening', subId);
      await saveTest(); render();
      toast((S.test.listening[subId].raPass===false
        ? 'Listening enviado. No alcanzaste el mínimo requerido: Writing y Speaking de esta sección quedan bloqueados y la prueba se detiene aquí.'
        : 'Listening enviado y calificado automáticamente.') + (TEST_MODE ? scoreBreakdownText('listening', subId) : ''), TEST_MODE ? 9000 : 2400);
    };
  });
  document.querySelectorAll('[id^="fake-play-"]').forEach(b=> b.onclick = ()=> toast('El audio de esta sección aún no está disponible.'));

  // writing
  document.querySelectorAll('.textarea[id^="wtext-"]').forEach(ta=>{
    ta.oninput = ()=>{
      const id = ta.id.replace('wtext-','');
      S.test.writing[id].text = ta.value;
      const cd = document.getElementById('wcount-'+id);
      const def = CONTENT.writing.find(w=>w.id===id);
      cd.textContent = `Words: ${wordCount(ta.value)} / ${def.wordRange[0]}–${def.wordRange[1]} recommended`;
    };
  });
  document.querySelectorAll('[data-ai-analyze]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.aiAnalyze;
      const rec = S.test.writing[id];
      if(wordCount(rec.text) < 5){ toast('Escribe tu respuesta antes de analizarla.'); return; }
      const result = aiAnalyzeWriting(id, rec.text);
      rec.aiChecklist = result.checklist;
      rec.aiLevel = result.suggestedLevel;
      rec.aiLevelScore = result.coveragePct;
      await saveTest(); render(); toast('Análisis de IA completado (estimación preliminar).');
    };
  });
  document.querySelectorAll('[data-submit-writing]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.submitWriting;
      const rec = S.test.writing[id];
      const def = CONTENT.writing.find(w=>w.id===id);
      if(wordCount(rec.text) < def.wordRange[0]*0.6){ toast('Tu respuesta parece muy corta. Revísala antes de enviar.'); return; }
      if(!rec.aiChecklist){ const result = aiAnalyzeWriting(id, rec.text); rec.aiChecklist=result.checklist; rec.aiLevel=result.suggestedLevel; rec.aiLevelScore=result.coveragePct; }
      rec.completed = true; rec.submitted = true;
      await saveTest(); render(); toast('Writing enviado. Pendiente de evaluación docente.');
    };
  });

  // speaking recording
  const recBtn = document.getElementById('rec-toggle-btn');
  if(recBtn) recBtn.onclick = ()=> toggleRecording(recBtn.dataset.task);
  document.querySelectorAll('[data-submit-speaking]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.submitSpeaking;
      let stopOk = true;
      if(S.recording.active) stopOk = await stopRecording(id);
      if(!S.test.speaking[id].recorded){
        if(stopOk!==false) toast('Debes grabar tu audio antes de enviar: el docente lo escuchará para calificar.');
        render(); return;
      }
      S.test.speaking[id].completed = true;
      await saveTest(); render(); toast('Speaking enviado. Pendiente de evaluación docente.');
    };
  });

  // results
  const printBtn = document.getElementById('print-report-btn');
  if(printBtn) printBtn.onclick = ()=> window.print();
  hydrateAudios();
}

/* ---------------------------- SPEAKING RECORDING --------------------------- */
function blobToDataUrl(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); });
}
async function toggleRecording(taskId){
  if(S.recording.active){ await stopRecording(taskId); render(); return; }
  if(S.recording.stopping) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Tu navegador no permite grabar audio aquí. Prueba con otro navegador o dispositivo.');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    // Voz a 24 kbps: ~180 KB por minuto (antes ~1 MB), para que quepa siempre en el almacenamiento.
    let mr;
    try{ mr = new MediaRecorder(stream, {audioBitsPerSecond:24000}); }
    catch(e){ mr = new MediaRecorder(stream); }
    S.recording.mediaRecorder = mr;
    S.recording.stopping = false;
    S.recording.chunks = [];
    S.recording.startedAt = Date.now();
    mr.ondataavailable = e=> { if(e.data && e.data.size) S.recording.chunks.push(e.data); };
    mr.start(1000);
    S.recording.active = true;
    render();
    const def = CONTENT.speaking.find(x=>x.id===taskId);
    const maxSec = (def && def.maxSeconds) || 120;
    S.recording.timer = setInterval(async ()=>{
      const secs = Math.floor((Date.now()-S.recording.startedAt)/1000);
      const el = document.getElementById('rec-timer');
      if(el){ el.textContent = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0'); }
      if(secs>=maxSec && S.recording.active && !S.recording.stopping){ const ok = await stopRecording(taskId); render(); if(ok) toast('Se alcanzó el tiempo máximo; la grabación se detuvo y se guardó.'); }
    }, 500);
  }catch(e){
    toast('No se pudo acceder al micrófono. Revisa los permisos del navegador.');
  }
}
/* Devuelve true si el audio quedó guardado, false si no. Muestra su propio
   mensaje de error (con el motivo real) para que nadie lo pise después. */
async function stopRecording(taskId){
  if(S.recording.stopping) return false;          // evita doble parada (temporizador + clic)
  S.recording.stopping = true;
  clearInterval(S.recording.timer);
  const durSec = Math.round((Date.now()-S.recording.startedAt)/1000);
  const mr = S.recording.mediaRecorder;
  let blob = null;
  if(mr && mr.state !== 'inactive'){
    blob = await new Promise(res=>{
      mr.onstop = ()=> res(new Blob(S.recording.chunks, {type: mr.mimeType || 'audio/webm'}));
      try{ mr.stop(); }catch(e){ res(null); }
    });
    try{ mr.stream.getTracks().forEach(tr=>tr.stop()); }catch(e){}
  }
  S.recording.active = false;
  S.recording.stopping = false;
  const rec = S.test.speaking[taskId];
  rec.duration = durSec;
  if(!(blob && blob.size)){
    rec.recorded = false;
    toast('No se registró audio. Mantén la grabación al menos unos segundos e intenta de nuevo.');
    return false;
  }
  const kb = Math.round(blob.size/1024);
  try{
    const dataUrl = await blobToDataUrl(blob);
    const key = 'audio:'+S.user.email+'|'+taskId;
    const saved = await window.storage.set(key, dataUrl, true);   // compartido para que el docente pueda escucharlo
    if(saved===null || saved===undefined) throw new Error('el almacenamiento no confirmó el guardado');
    S.audioCache = S.audioCache || {};
    S.audioCache[taskId] = dataUrl;
    rec.audioKey = key; rec.recorded = true;
    await saveTest();
    toast(`Audio guardado (${durSec}s).`);
    return true;
  }catch(e){
    console.error('Audio storage error', e);
    rec.recorded = false;
    toast(`No se pudo guardar el audio (${kb} KB): ${(e && e.message) || e}. Intenta grabar de nuevo.`);
    return false;
  }
}
/* Carga perezosa de audios guardados: cualquier <audio data-audio-key> sin src. */
async function hydrateAudios(){
  const els = document.querySelectorAll('audio[data-audio-key]');
  for(const el of els){
    if(el.getAttribute('src') || !el.dataset.audioKey) continue;
    try{ const r = await window.storage.get(el.dataset.audioKey, true); if(r && r.value) el.src = r.value; }catch(e){}
  }
}

document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && S.qModal){ S.qModal = null; render(); }
});

/* -----------------------------------------------------------------------
   AUTO-LOGIN (temporal, para pruebas)
   -------------------------------------------------------------------------
   Salta la pantalla de inicio de sesión para agilizar las pruebas.
   El código del login (renderAuth, listeners del form, logout, etc.) sigue
   intacto: para volver a exigir inicio de sesión, basta con borrar/comentar
   este bloque "AUTO-LOGIN" y dejar que arranque normalmente con render().
   ------------------------------------------------------------------------- */
/* Borra el avance guardado del estudiante actual (progreso, copia compartida
   y audios) y vuelve a la presentación con una prueba vacía. */
async function resetMyTest(){
  const email = S.user.email;
  const keys = [['progress:'+email,false],['student:'+email,true]]
    .concat(CONTENT.speaking.map(d=>['audio:'+email+'|'+d.id,true]));
  for(const [k,shared] of keys){ try{ await window.storage.delete(k, shared); }catch(e){} }
  S.audioCache = {};
  S.readingActiveRA = {}; S.listeningActiveRA = {}; S.qModal = null; S.gapSel = null;
  S.activeSection = 1; S.activeSkill = null; S.activeSub = 0; S.subView = false;
  S.test = makeEmptyTest(S.user);
  S.screen = 'presentation';
  await saveTest();
  render();
  toast('Prueba reiniciada. Empiezas desde cero.');
}
/* ?reset en la dirección: limpia TODO lo guardado por el sitio en este navegador. */
async function wipeAllStorage(){
  try{
    for(const shared of [false,true]){
      const l = await window.storage.list('', shared);
      for(const k of (l && l.keys)||[]){ try{ await window.storage.delete(k, shared); }catch(e){} }
    }
  }catch(e){ console.error('wipe error', e); }
}
async function bootAutoLogin(){
  if(TEST_MODE && /[?&]reset(=|&|$)/.test(location.search)){
    await wipeAllStorage();
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
  }
  const defaultUser = {name:'Estudiante Demo', email:'demo@ctma.edu.co', id:'DEMO'};
  S.user = defaultUser;
  let existing = await loadTest(defaultUser.email);
  if(!existing) existing = makeEmptyTest(defaultUser);
  S.test = existing;
  S.screen = 'presentation';
  if(existing.presentationSeen){
    S.activeSection = defaultSection(); S.activeSkill=null; S.subView=false; S.screen='section';
  }
  await saveTest();
  render();
}
bootAutoLogin();
