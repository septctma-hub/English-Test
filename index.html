<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Placement Test — Plataforma de Clasificación</title>
<style>
:root{
  --ink:#0B1220;
  --paper:#F5F6F8;
  --card:#FFFFFF;
  --primary:#1E3A5F;
  --primary-2:#2C5282;
  --primary-soft:#E8EEF5;
  --accent:#B8862E;
  --accent-soft:#F6ECD9;
  --success:#2F7D5C;
  --success-soft:#E5F3EC;
  --danger:#B23A3A;
  --danger-soft:#FBEAEA;
  --muted:#5B6572;
  --border:#DFE3E9;
  --locked:#9AA3AF;
  --radius:10px;
  --serif:'Source Serif 4','Iowan Old Style',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
::selection{background:var(--accent-soft)}

/* ---------- Utility ---------- */
.hidden{display:none !important}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--primary-2);
  outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;transition-duration:0.001ms !important}
}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}

/* Auth screen */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 600px at 15% -10%, #16324f 0%, transparent 60%),
    linear-gradient(160deg, var(--primary) 0%, #10233A 100%);
  padding:24px;
}
.auth-card{
  width:100%;max-width:920px;background:var(--card);border-radius:16px;
  display:grid;grid-template-columns:1.1fr 1fr;overflow:hidden;
  box-shadow:0 30px 60px -20px rgba(11,18,32,.45);
}
.auth-side{
  background:linear-gradient(165deg,#132A44,#0C1D30);
  color:#fff;padding:44px 38px;display:flex;flex-direction:column;justify-content:space-between;
}
.auth-eyebrow{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:#9FC0E0;margin-bottom:14px;
}
.auth-side h1{
  font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.15;margin-bottom:14px;
}
.auth-side p{color:#C4D3E2;font-size:.95rem;line-height:1.6;max-width:32ch}
.ra-mini-list{margin-top:28px;display:flex;flex-direction:column;gap:9px}
.ra-mini{display:flex;gap:10px;align-items:baseline;font-size:.82rem;color:#B9CADB}
.ra-mini b{font-family:var(--mono);color:var(--accent);font-weight:600;font-size:.75rem}
.auth-form-side{padding:44px 40px}
.auth-form-side h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:6px;color:var(--ink)}
.auth-sub{color:var(--muted);font-size:.9rem;margin-bottom:26px}
.role-switch{display:flex;background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:4px;margin-bottom:22px}
.role-switch button{
  flex:1;border:none;background:none;padding:8px 10px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted);
}
.role-switch button.active{background:var(--primary);color:#fff}
.field{margin-bottom:16px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--ink);margin-bottom:6px}
.field input{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:8px;font-size:.92rem;
  transition:border-color .15s, box-shadow .15s;background:#fff;
}
.field input:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px var(--primary-soft)}
.form-error{
  background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:.85rem;
  margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;
}
.btn{
  border:none;border-radius:8px;padding:12px 18px;font-weight:600;font-size:.92rem;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s, box-shadow .15s, background .15s;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff;width:100%}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:none;color:var(--primary-2);padding:8px 4px;font-size:.85rem}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--ink)}
.btn-outline:hover{border-color:var(--primary-2);color:var(--primary-2)}
.btn-accent{background:var(--accent);color:#fff}
.btn-danger-outline{background:#fff;border:1px solid var(--danger);color:var(--danger)}
.forgot-row{text-align:right;margin-bottom:20px}
.demo-note{
  margin-top:20px;font-size:.76rem;color:var(--muted);background:var(--paper);border:1px dashed var(--border);
  border-radius:8px;padding:10px 12px;line-height:1.5;
}

/* ---------- Top bar ---------- */
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px;
  position:sticky;top:0;z-index:20;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:36px;height:36px;border-radius:9px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:700;
}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-family:var(--serif);font-size:1.02rem}
.brand-text span{font-size:.7rem;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.student-chip{
  display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--border);
  border-radius:999px;padding:6px 14px 6px 6px;
}
.avatar{
  width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;
}
.chip-meta{font-size:.75rem;color:var(--muted);line-height:1.3}
.chip-meta b{color:var(--ink);font-size:.82rem}
.topbar-right{display:flex;align-items:center;gap:14px}
.status-pill{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.03em;padding:5px 11px;border-radius:999px;font-weight:600;
}
.status-not_started{background:#EEF0F3;color:var(--muted)}
.status-in_progress{background:var(--accent-soft);color:var(--accent)}
.status-pending_evaluation{background:#FDEFDC;color:#9A5B12}
.status-completed{background:var(--success-soft);color:var(--success)}
.status-finalized{background:var(--primary-soft);color:var(--primary)}
.progress-ring-wrap{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}

/* ---------- Layout ---------- */
.layout{display:flex;flex:1;min-height:0}
.sidebar{
  width:230px;background:var(--card);border-right:1px solid var(--border);padding:20px 12px;
  display:flex;flex-direction:column;gap:4px;flex-shrink:0;
  transition:width .18s ease, padding .18s ease;
}
.sidebar-toggle{
  display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;
  border:1px solid var(--border);background:#fff;color:var(--muted);flex-shrink:0;margin-right:6px;
}
.sidebar-toggle:hover{background:var(--paper)}
.sidebar.collapsed{width:64px;padding:20px 8px}
.sidebar.collapsed .side-item{justify-content:center;padding:10px 6px;gap:0}
.sidebar.collapsed .side-item span:not(.num){display:none}
.sidebar.collapsed .side-lock-icon{display:none}
.side-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:8px;border:none;background:none;
  text-align:left;width:100%;color:var(--muted);font-size:.88rem;font-weight:600;position:relative;
}
.side-item .num{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.68rem;background:#EEF0F3;color:var(--muted);flex-shrink:0;
}
.side-item.active{background:var(--primary-soft);color:var(--primary)}
.side-item.active .num{background:var(--primary);color:#fff}
.side-item.done .num{background:var(--success);color:#fff}
.side-item.locked{color:var(--locked);cursor:not-allowed}
.side-item.locked .num{background:#F1F2F4;color:var(--locked)}
.side-item:not(.locked):not(.active):hover{background:var(--paper)}
.side-lock-icon{margin-left:auto;color:var(--locked)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}

.main{flex:1;min-width:0;padding:30px 34px 60px;overflow-y:auto}
.main-inner{max-width:900px;margin:0 auto}
.main-inner-wide{max-width:none}

.reading-split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;min-width:0}
.rs-passage-col{position:sticky;top:20px;align-self:start;min-width:0}
.rs-passage-card{max-height:calc(100vh - 140px);overflow-y:auto}
.q-pagination{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0 4px;padding-top:14px;border-top:1px solid var(--border)}
.q-page-btn{
  display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;
  border:1px solid var(--border);background:#fff;color:var(--ink);flex-shrink:0;
}
.q-page-btn:hover:not(:disabled){background:var(--paper)}
.q-page-btn:disabled{opacity:.35;cursor:not-allowed}
.q-page-indicator{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap}
@media (max-width:900px){
  .reading-split{grid-template-columns:1fr}
  .rs-passage-col{position:static}
  .rs-passage-card{max-height:none}
}

.q-index-list{display:flex;flex-direction:column;gap:6px}
.q-index-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;
  cursor:pointer;font:inherit;color:var(--ink);
}
.q-index-item:hover{background:var(--paper);border-color:var(--accent,#999)}
.q-index-item.answered{border-color:#2e7d32;background:#f3f9f3}
.q-index-num{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;background:var(--paper);
  font-family:var(--mono);font-size:.76rem;font-weight:600;
}
.q-index-item.answered .q-index-num{background:#2e7d32;color:#fff}
.q-index-text{flex:1;font-size:.86rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.q-block{scroll-margin-top:20px}

.section-toggle{display:flex;gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.section-toggle-btn{
  flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;
  color:var(--ink);font:inherit;font-weight:600;font-size:.84rem;cursor:pointer;text-align:center;
}
.section-toggle-btn:hover{background:var(--paper)}
.section-toggle-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.rs-questions-col{position:relative;min-width:0}
.q-focus-overlay{
  position:absolute;inset:0;z-index:20;margin:0;min-height:460px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 16px 44px rgba(11,18,32,.28);
}
.q-focus-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:14px;margin-bottom:0;border-bottom:1px solid var(--border)}
.q-focus-overlay-body{padding:16px 0;overflow-y:auto;flex:1}
.q-focus-overlay-body .q-block{border:none;padding:0;margin-bottom:0}
.q-focus-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--border)}
.modal-close{background:none;border:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:6px;flex-shrink:0}
.modal-close:hover{background:var(--paper);color:var(--ink)}
.modal-progress{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}

/* Mobile top tabs (shown instead of sidebar) */
.mobile-tabs{display:none;overflow-x:auto;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.mobile-tab{
  flex-shrink:0;border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 13px;font-size:.78rem;
  font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;
}
.mobile-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.mobile-tab.locked{color:var(--locked)}

/* ---------- Cards / content ---------- */
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:block}
.page-title{font-family:var(--serif);font-size:1.7rem;margin-bottom:8px;color:var(--ink)}
.page-sub{color:var(--muted);font-size:.95rem;margin-bottom:26px;max-width:64ch;line-height:1.6}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;margin-bottom:20px;
}
.card h3{font-family:var(--serif);font-size:1.15rem;margin-bottom:12px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:18px 0}
.info-box{background:var(--paper);border-radius:8px;padding:14px 16px}
.info-box .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.info-box .v{font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.demo-tag{
  display:inline-block;font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;background:var(--danger-soft);
  color:var(--danger);padding:2px 8px;border-radius:4px;vertical-align:middle;margin-left:8px;
}

/* Subsection stepper */
.stepper{display:flex;flex-direction:column;margin:22px 0;position:relative}
.step{display:flex;gap:16px;padding:16px 6px;position:relative}
.step:not(:last-child)::before{
  content:'';position:absolute;left:19px;top:44px;bottom:-6px;width:2px;background:var(--border);
}
.step-dot{
  width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--locked);z-index:1;
}
.step.done .step-dot{background:var(--success);border-color:var(--success);color:#fff}
.step.active .step-dot{background:var(--primary);border-color:var(--primary);color:#fff}
.step-body{flex:1;padding-top:4px}
.step-title{font-weight:700;font-size:.98rem;margin-bottom:2px}
.step-desc{font-size:.83rem;color:var(--muted);margin-bottom:10px}
.step-status{font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase}
.step.locked .step-title{color:var(--locked)}
.step.done .step-status{color:var(--success)}
.step.active .step-status{color:var(--primary)}
.step.locked .step-status{color:var(--locked)}
.step.stopped .step-dot{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.step.stopped .step-title{color:var(--danger)}
.step.stopped .step-status{color:var(--danger)}

/* Question / prompt blocks */
.prompt-box{
  background:var(--primary-soft);border-left:3px solid var(--primary);border-radius:4px 8px 8px 4px;
  padding:16px 18px;margin-bottom:18px;
}
.prompt-box p{font-size:.92rem;line-height:1.6;margin-bottom:1em}
.prompt-box p:last-child{margin-bottom:0}
.q-block{border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:14px;background:#fff}
.q-num{font-family:var(--mono);font-size:.72rem;color:var(--accent);margin-bottom:6px;display:block}
.q-text{font-weight:600;margin-bottom:12px;font-size:.94rem}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-size:.9rem;transition:border-color .1s, background .1s;
}
.opt:hover{border-color:var(--primary-2)}
.opt input{accent-color:var(--primary)}

.audio-box{
  background:var(--paper);border:1.5px dashed var(--border);border-radius:10px;padding:22px;text-align:center;
  margin-bottom:18px;color:var(--muted);
}
.audio-box .play-btn{
  width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;border:none;
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;
}
.ra-tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ra-tag{
  font-family:var(--mono);font-size:.66rem;background:var(--accent-soft);color:var(--accent);padding:2px 8px;
  border-radius:4px;font-weight:600;letter-spacing:.03em;margin-right:8px;
}
.text-answer-input{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.9rem;
  transition:border-color .1s, background .1s;
}
.text-answer-input:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px var(--primary-soft)}
.text-answer-input[disabled]{color:var(--ink)}

.text-answer-key{font-size:.78rem;color:var(--muted);margin-top:6px}
.text-answer-key b{color:var(--ink)}
/* Drag & drop de ordenamiento (pregunta type:'order') */
.order-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.order-item{
  display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;background:#fff;font-size:.9rem;cursor:grab;
  transition:border-color .1s, background .1s, transform .1s, box-shadow .1s;
}
.order-item:active{cursor:grabbing}
.order-item.dragging{opacity:.4}
.order-item.drag-over{border-color:var(--primary-2);box-shadow:0 0 0 3px var(--primary-soft)}
.order-item[draggable="false"]{cursor:default}
.order-drag-handle{color:var(--muted);font-size:1rem;flex-shrink:0;user-select:none}
.order-item-num{
  font-family:var(--mono);font-size:.72rem;color:var(--muted);flex-shrink:0;width:18px;text-align:center;
}


/* Huecos con palabras arrastrables */
.gap-bank{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin-bottom:12px;border:1px dashed var(--border);border-radius:8px;background:var(--paper);margin-top:12px}
.gap-bank-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-right:4px}
.gap-chip{touch-action:none;padding:6px 14px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:.9rem;cursor:grab;user-select:none;transition:border-color .1s, box-shadow .1s}
.gap-chip:hover{border-color:var(--primary-2)}
.gap-chip.selected{border-color:var(--primary-2);box-shadow:0 0 0 3px var(--primary-soft)}
.gap-chip.used{opacity:.3;border-style:dashed;cursor:default}
.gap-slot{display:inline-flex;align-items:center;gap:6px;min-width:104px;padding:1px 8px;margin:0 2px;border:1.5px dashed var(--primary-2);border-radius:6px;background:var(--primary-soft);vertical-align:baseline;cursor:pointer}
.gap-slot.filled{border-style:solid;background:#fff}
.gap-slot.drag-over{box-shadow:0 0 0 3px var(--primary-soft);border-color:var(--primary-2)}
.gap-num{font-size:.7rem;color:var(--muted);font-family:var(--mono)}
.gap-word{font-weight:600;cursor:grab;touch-action:none;user-select:none}
.gap-ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);padding:6px 14px;border:1px solid var(--primary-2);border-radius:999px;background:#fff;font-size:.9rem;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.gap-progress{padding:8px 2px;color:var(--muted);font-size:.9rem}
.gap-progress b{color:var(--ink)}

/* Pregunta de ordenar mostrada directamente en el listado */
.q-inline{padding:4px 0 8px}
.q-inline .q-block{margin:0;border:none;padding:0}

/* Writing */
.textarea{
  width:100%;min-height:130px;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:.92rem;
  resize:vertical;line-height:1.6;transition:border-color .15s, box-shadow .15s;
}
.textarea:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px var(--primary-soft)}
.textarea[disabled]{background:var(--paper);color:var(--muted)}
.word-count{font-size:.78rem;color:var(--muted);margin-top:6px;text-align:right;font-family:var(--mono)}
.checklist-wrap{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:16px}
.checklist-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.check-item{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:6px;padding:9px 11px;margin-bottom:7px}

/* ==========================================================================
   ALMACENAMIENTO (respaldo). window.storage solo existe dentro de la vista
   previa de Claude. Si el sitio se abre desde otro lugar (hosting propio,
   archivo local, página publicada), se crea aquí una versión con la misma
   interfaz sobre IndexedDB del NAVEGADOR (cabe audio; sin el límite de ~5 MB
   de localStorage), con respaldo en memoria si el navegador no la permite.
   LIMITACIÓN: los datos quedan solo en ese navegador/dispositivo; el panel
   del docente NO verá a estudiantes de otros equipos hasta tener un servidor. */
(function(){
  if(window.storage && typeof window.storage.set==='function') return;
  const mem = new Map();
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve)=>{
      try{
        if(!window.indexedDB){ resolve(null); return; }
        const req = indexedDB.open('ctma-placement', 1);
        req.onupgradeneeded = ()=> req.result.createObjectStore('kv');
        req.onsuccess = ()=> resolve(req.result);
        req.onerror = ()=> resolve(null);
        req.onblocked = ()=> resolve(null);
      }catch(e){ resolve(null); }
    });
    return dbPromise;
  }
  const fk = (key, shared)=> (shared?'s:':'p:')+key;
  function idb(db, mode, fn){
    return new Promise((resolve, reject)=>{
      const tx = db.transaction('kv', mode);
      const store = tx.objectStore('kv');
      let out;
      try{ out = fn(store); }catch(e){ reject(e); return; }
      tx.oncomplete = ()=> resolve(out && 'result' in out ? out.result : undefined);
      tx.onerror = ()=> reject(tx.error);
      tx.onabort = ()=> reject(tx.error || new Error('transacción cancelada'));
    });
  }
  window.storage = {
    async get(key, shared=false){
      const k = fk(key, shared), db = await openDB();
      const v = db ? await idb(db,'readonly',st=>st.get(k)) : mem.get(k);
      if(v===undefined || v===null) throw new Error('Key not found: '+key);
      return {key, value:v, shared:!!shared};
    },
    async set(key, value, shared=false){
      const k = fk(key, shared), db = await openDB();
      if(db) await idb(db,'readwrite',st=>st.put(value,k)); else mem.set(k,value);
      return {key, value, shared:!!shared};
    },
    async delete(key, shared=false){
      const k = fk(key, shared), db = await openDB();
      if(db) await idb(db,'readwrite',st=>st.delete(k)); else mem.delete(k);
      return {key, deleted:true, shared:!!shared};
    },
    async list(prefix='', shared=false){
      const pre = fk(prefix, shared), db = await openDB();
      let all;
      if(db) all = await idb(db,'readonly',st=>st.getAllKeys());
      else all = [...mem.keys()];
      const keys = all.filter(k=>String(k).startsWith(pre)).map(k=>String(k).slice(2));
      return {keys, prefix, shared:!!shared};
    }
  };
})();

    { id:'r2', title:'Reading 2 — "Operational Incident & Safety Rules"',
      passages:[
        {ra:'RA2', heading:'Text 1: Operational Incident and Future Steps',
          instructions:"Task 1 (RA2): lee el informe de un incidente logístico presentado por una supervisora de operaciones y organiza las acciones según su secuencia temporal real.",
          text:"Reported by: Elena Rostova, Operations Supervisor\n\nLast Tuesday, our team was preparing a shipment for an important client. While the technicians were loading the main cargo, a sensor suddenly failed and stopped the line. Immediately, we called the technician who handles emergency maintenance. He discovered that the old cable was worse than the new replacement, so we had to replace it right away. According to company regulations, operators must wear protective gear at all times, and they should report any minor error before restarting the system. The technician said that the machinery is completely safe now, but if another sensor fails tomorrow, the automated system will shut down the entire line automatically.\n\nTo prevent future delays, we are going to set up a double-check protocol next month. Moreover, next week I will hire a specialist who knows how to calibrate these sensors. If we had more backup spare parts in stock, we would solve these issues much faster. First, we will inspect the new cables; then, we will test the system; after that, we will update the logbook; and finally, we will send the final report to the manager." },
        {ra:'RA3', heading:'Text 2: Prevention and Safety Regulations',
          instructions:"Task 2 (RA3): lee la continuación del informe de la supervisora Elena y completa cada espacio (1-8) con una palabra del banco. Usa cada palabra una sola vez.",
          wordBank:["who", "must", "who", "says", "will", "first", "then", "after that"],
          text:"To guarantee that our operations stay safe, we have introduced new rules for the whole team. (1) ________, all operators (2) ________ wear their safety helmets before entering the main hall. We also spoke with the chief engineer, (3) ________ explained the technical risks of skipping maintenance. He told us that if we don't inspect the sensors regularly, the machinery (4) ________ shut down again during high-production hours.\n\n(5) ________, we need to test the backup generator. (6) ________, we will train the new staff members (7) ________ were hired last week. The manager (8) ________ that all safety protocols must be strictly followed from now on." },
      ],

        {q:"Ordena los 8 eventos según su secuencia temporal real en el relato (1 = evento más antiguo en el pasado / 8 = último paso en el futuro). Arrastra cada evento a su posición.", type:'order', partial:true, ra:'RA2', focus:'Ordenamiento cronológico: Simple Past, Past Continuous, will, going to',

          // Clave (PDF actualizado): 1 preparing · 2 sensor failed · 3 called technician · 4 discovered cable ·

          text:"Prepared by: Strategic Management Board\n\nOver the last three years, our company has been implementing an eco-friendly policy to reduce energy consumption. Many process delays have been caused by outdated software; consequently, new digital platforms were installed last month by the IT department. If we had updated the server infrastructure earlier, we would have avoided the critical system crash of last quarter. The chief consultant reported that the administrative team had already completed the preliminary audit before the inspectors arrived.\n\nFurthermore, recent research shows that employees who work in flexible schedules demonstrate higher productivity. Although initial budget restrictions were challenging, the board has approved extra funding for green technology. However, the management team should have consulted the department heads before making the final announcement. They could have organized a town hall meeting to address employee concerns. In spite of these minor communication gaps, the new project, which aims to reduce carbon emissions by 40%, will be launched next week." },

    { id:'l1', title:'Listening 1 — "A Phone Call Between Friends"',

      audio:null, // TODO: ruta del archivo de audio (ej. 'audio/s1-listening.mp3') cuando esté disponible
      transcript:"Carlos: Hi Sofía! It's Carlos. Are you busy right now?\nSofía: Oh, hi Carlos! No, not really. I am preparing lunch in the kitchen. My phone is on the dining table, so I am using my speaker.\nCarlos: Great! I'm calling because I need help with the new apartment rules. By the way, is your brother still working at the library?\nSofía: Yes, he is! He goes there from Monday to Friday at 8:00 AM. He usually cleans his workspace first and then registers new books.\nCarlos: Nice. Hey, what is that noise in your house?\nSofía: Ah, my father is assembling a new chair. The chair is made of recycled wood, and it is painted by my sister.\nCarlos: Cool! Listen, if you mix blue and yellow paint, you get green, right? I need to paint my room door today.\nSofía: Yes, exactly! If you mix those colors, you get green. Remember: don't leave the paint bucket open!\nCarlos: Thanks! What are you doing later today?\nSofía: Well, I usually pick up my cousin at 4:00 PM, but today I am meeting a friend for coffee at 5:00 PM. See you!", // solo para el docente / grabación; NO se muestra al estudiante

    { id:'l2', title:'Listening 2 — "Planning a Work Conference"',
      instructions:"Escucha la conversación entre dos coordinadores de eventos (David y Andrea) sobre la organización de una conferencia laboral. Escucharás el audio para las dos tareas.",

        RA3:"Task 2 (RA3) — Discriminación auditiva de reglas y condicionales: elige la respuesta correcta para cada pregunta."
      },
      audio:null, // TODO: ruta del audio de la conversación David y Andrea
      transcript:"David: Hi Andrea! How was the site visit yesterday?\nAndrea: It was productive, David. While I was inspecting the main auditorium, the technician was testing the sound system. It is much larger than the room we used last year!\nDavid: Great! Did you figure out the schedule issues?\nAndrea: Yes. Last night, I sent the invitations. If the speakers confirm today, we will publish the official agenda tomorrow.\nDavid: Perfect. What are we going to do about the catering service?\nAndrea: We are going to hire a local catering company that specializes in healthy food. However, we have to sign the contract before Friday because it is mandatory.\nDavid: Agreed. Remember that attendees should register online to avoid long lines. By the way, what did the director say about the budget?\nAndrea: The director says that we must keep expenses under $5,000. If we had a bigger budget, we would invite an international speaker!\nDavid: Okay. So, first, we will finalize the speaker list; then, we will pay the deposit; after that, we will print the badges; and finally, we will open the doors.", // solo docente / grabación
      questions:[
        {q:"While Andrea was inspecting the auditorium, the technician was (1) ____________________ the sound system.", type:'text', answer:"testing", ra:'RA2', focus:"RA2.1 — Past Continuous (was testing)"},
        {q:"The new auditorium is much (2) ____________________ than the one used last year.", type:'text', answer:"larger", ra:'RA2', focus:"RA2.2 — Comparativos (larger than)"},
        {q:"Last night, Andrea (3) ____________________ the official invitations.", type:'text', answer:"sent", ra:'RA2', focus:"RA2.3 — Simple Past (sent)"},
        {q:"If speakers confirm today, they will publish the agenda (4) ____________________.", type:'text', answer:"tomorrow", ra:'RA2', focus:"RA2.4 — First Conditional / marcador de futuro (tomorrow)"},
        {q:"They are going to (5) ____________________ a local catering company.", type:'text', answer:"hire", ra:'RA2', focus:"RA2.5 — Going to (hire)"},
        {q:"David asks if Andrea managed to (6) ____________________ the schedule issues.", type:'text', answer:"figure out", ra:'RA2', focus:"RA2.6 — Phrasal verb (figure out)"},
        {q:"David asks: What (7) ____________________ the director say about the budget?", type:'text', answer:"did", ra:'RA2', focus:"RA2.7 — Simple Past interrogativo (did)"},
        {q:"After finalizing the speaker list, David and Andrea will pay the (8) ____________________.", type:'text', answer:"deposit", ra:'RA2', focus:"RA2.8 — Conectores de secuencia / Will (deposit)"},
        {q:"What type of catering company are they going to hire?", opts:["A company who offers cheap fast food.", "A company that specializes in healthy food.", "A company where David worked before.", "A service which requires no contract."], correct:1, ra:'RA3', focus:"RA3.1 — Relative Clauses"},
        {q:"What obligation (have to) must be completed before Friday?", opts:["Sign the contract with the catering company.", "Print all the badges.", "Open the doors to attendees.", "Call the international speaker."], correct:0, ra:'RA3', focus:"RA3.2 — Modals / Have to & Must"},

        {q:"What would they do if they had a bigger budget?", opts:["They would rent a bigger stadium.", "They would invite an international speaker.", "They would cancel the conference.", "They would hire more technicians."], correct:1, ra:'RA3', focus:"RA3.4 — Second Conditional"},
        {q:"What does the director state regarding the financial budget?", opts:["The director says that they must keep expenses under $5,000.", "The director said that money was not a problem.", "The director orders to double the budget.", "The director reports that catering is free."], correct:0, ra:'RA3', focus:"RA3.5 — Reported Speech"},
        {q:"What is the third action (after that) in their planning sequence?", opts:["Finalize the speaker list.", "Pay the deposit.", "Print the badges.", "Open the doors."], correct:2, ra:'RA3', focus:"RA3.6 — Sequence Connectors"},
        {q:"David asks: \"Did you figure out the schedule issues?\" What does \"figure out\" mean?", opts:["Find a solution to", "Forget about", "Cancel", "Delay"], correct:0, ra:'RA3', focus:"RA3.7 — Phrasal Verbs"},

      audio:null, // TODO: ruta del audio de la reunión (director, manager, equipo)

/* ------------------- ESPECIFICACIÓN DEL PLACEMENT (PDF v5) ---------------
   Fuente de verdad de umbrales y estructura. Todo se mide por CONTEO sobre
   8 ítems por RA y por habilidad (el porcentaje es solo referencial):
     Sección 1 (RA1):        Reading 5/8 · Listening 5/8 · Writing 4/8 · Speaking 4/8
     Sección 2 (RA2 y RA3):  Reading 6/8 · Listening 6/8 · Writing 5/8 · Speaking 5/8
     Sección 3 (RA4 y RA5):  6/8 en las cuatro habilidades
   Un RA se aprueba solo si se alcanza el mínimo en LAS 4 habilidades (AND).
   RA6 no se evalúa: es la ubicación de quien aprueba RA1–RA5. */
const ITEMS_PER_RA = 8;
const PLACEMENT_SPEC = {
  RA1:{section:1, cefr:'A1.1 / A1.2', min:{reading:5, listening:5, writing:4, speaking:4}},
  RA2:{section:2, cefr:'A2.1',        min:{reading:6, listening:6, writing:5, speaking:5}},
  RA3:{section:2, cefr:'A2.2',        min:{reading:6, listening:6, writing:5, speaking:5}},
  RA4:{section:3, cefr:'B1.1',        min:{reading:6, listening:6, writing:6, speaking:6}},
  RA5:{section:3, cefr:'B1.2',        min:{reading:6, listening:6, writing:6, speaking:6}},
};
function raMin(ra, skill){ const sp = PLACEMENT_SPEC[ra]; return sp ? sp.min[skill] : null; }
/* Regla de aprobación de un RA en una habilidad. Con 8 ítems es exactamente
   el conteo del PDF; si un bloque temporal tiene otro total (contenido aún
   no migrado), se escala proporcionalmente. */
function passesRA(ra, skill, achieved, total){
  const min = raMin(ra, skill);
  if(min===null || !total) return false;
  return achieved >= Math.ceil(total*min/ITEMS_PER_RA);
}
function raCefrLabel(ra){
  if(ra==='RA6') return 'Suficiencia Total del Programa';
  const sp = PLACEMENT_SPEC[ra];
  return sp ? sp.cefr : '';
}
function raLabelWithCefr(ra){
  const cefr = raCefrLabel(ra);
  return cefr ? `${ra} (${cefr})` : ra;
}

/* Section unlock logic
   ---------------------------------------------------------------------
   STOP RULE (instrumento original, sección 2.2): para Reading y Listening,
   que se autocalifican al instante, avanzar al siguiente bloque de textos
   requiere haber alcanzado el mínimo por conteo (ver PLACEMENT_SPEC) en TODOS los RA cubiertos por el bloque
   anterior — no basta con haberlo enviado. Si el aprendiz no alcanza el
   mínimo en alguno de esos RA, el test se detiene ahí para esa habilidad:
   el siguiente bloque queda bloqueado de forma permanente y su resultado
   final en esa habilidad es el último RA que sí certificó.
   Writing y Speaking dependen de calificación docente (no instantánea),
   así que no se pueden detener en vivo con esta misma regla; sus
   subsecciones se siguen desbloqueando solo por envío, como antes. */
/* MODO PRUEBA: desglose de aciertos por RA (y por pregunta fallada) para
   detectar de inmediato qué respuesta se calificó como incorrecta. */
function scoreBreakdownText(skill, subId){
  const def = CONTENT[skill].find(s=>s.id===subId);
  const rec = S.test[skill][subId];
  const per = {}, wrong = [];
  def.questions.forEach((q,i)=>{
    const pt = questionPoints(q, rec.answers[i], rec.answers);
    const g = per[q.ra] || (per[q.ra] = {a:0,n:0});
    g.a += pt.a; g.n += pt.n;
    if(pt.a < pt.n) wrong.push(q.type==='order' ? `orden(${pt.a}/${pt.n})` : `#${i+1}`);
  });
  return ' [Modo prueba] ' + Object.entries(per).map(([ra,g])=>`${ra} ${g.a}/${g.n}`).join(' · ')
       + (wrong.length ? ' · falladas: '+wrong.join(', ') : '');
}
function subsectionRAPassed(skill, subId){
  if(skill!=='reading' && skill!=='listening') return true;
  const def = CONTENT[skill].find(s=>s.id===subId);
  const rec = S.test[skill][subId];
  const byRA = {};
  def.questions.forEach((q,i)=>{
    const g = byRA[q.ra] || (byRA[q.ra] = {correct:0,total:0});
    const pt = questionPoints(q, rec.answers[i], rec.answers);
    g.total += pt.n; g.correct += pt.a;
  });
  return Object.entries(byRA).every(([ra,g]) => passesRA(ra, skill, g.correct, g.total));
}
/* Parte 11 · Paso 2: el bloqueo es POR SECCIÓN. La subsección de índice i
   de cualquier habilidad pertenece a la sección i+1, así que está abierta
   si y solo si esa sección está abierta (las 4 habilidades a la vez). */
function subsectionUnlocked(skill, index){
  return sectionUnlocked(index+1) && !sectionSkillLocked(skill, index+1);
}
function subsectionStoppedByRule(skill, index){
  return sectionState(index+1)==='stopped_before';
}
/* Una habilidad está "completa" cuando ya se envió en todas las secciones
   que el estudiante puede alcanzar. Si la siguiente sección quedó bloqueada
   por Stop Rule, la habilidad se da por terminada; si simplemente aún no se
   abre (faltan otras habilidades de la sección actual), sigue en progreso. */
function skillCompleted(skill){
  for(const n of SECTION_ORDER){
    if(!sectionUnlocked(n)) return sectionState(n)==='stopped_before';
    if(!sectionSkillLocked(skill, n) && !sectionSkillSubmitted(skill, n)) return false;
  }
  return true;
}
/* Botón "continuar" junto al Score una vez enviada una habilidad. Por
   sección: salta a la siguiente habilidad pendiente de la MISMA sección; si
   la sección quedó cerrada, a la siguiente sección (si se abrió) o a Results
   (si el recorrido terminó). idx = índice de subsección (= sección - 1). */
function renderContinuePill(skill, idx){
  const n = idx+1;
  const btn = (attrs, label)=>`<button type="button" class="badge badge-done" style="border:none;cursor:pointer" ${attrs}>${label} ${ICONS.chevRight}</button>`;
  const nextSkill = SECTION_SKILL_ORDER.find(sk => !sectionSkillLocked(sk, n) && !sectionSkillSubmitted(sk, n));
  if(nextSkill) return btn(`data-open-skill="${nextSkill}"`, `Continuar a ${SKILL_META[nextSkill].label}`);
  if(testEnded()) return btn('data-nav="results"', 'Ver resultados');
  if(sectionUnlocked(n+1)) return btn(`data-nav="sec${n+1}"`, `Continuar a Sección ${n+1}`);
  return '';
}
function skillUnlocked(skill){
  return !!S.test.presentationSeen;
}
/* ==========================================================================
   MODELO POR SECCIÓN (Parte 11 · Paso 1)
   --------------------------------------------------------------------------
   El PDF organiza el test en 3 secciones. Cada sección agrupa las 4
   habilidades y usa la subsección de mismo número en CONTENT:
     Sección 1 → r1, l1, w1, s1  (RA1)
     Sección 2 → r2, l2, w2, s2  (RA2 y RA3)
     Sección 3 → r3, l3, w3, s3  (RA4 y RA5)
   Estas funciones SOLO calculan estado; todavía no las usa ninguna pantalla
   (se conectan en los pasos siguientes), así que el sitio se comporta igual.
   Regla: Reading y Listening deben alcanzar el mínimo (raPass) para poder
   pasar a la siguiente sección. Writing y Speaking no se autocalifican:
   no bloquean en vivo, pero deben estar enviados para cerrar la sección. */
const SECTION_ORDER = [1,2,3];
const SECTION_SKILL_ORDER = ['reading','listening','writing','speaking'];
const SECTION_META = {
  1:{label:'Sección 1', ras:['RA1']},
  2:{label:'Sección 2', ras:['RA2','RA3']},
  3:{label:'Sección 3', ras:['RA4','RA5']},
};
const AUTOGRADED_SKILLS = ['reading','listening'];
function sectionSubDef(skill, n){ return CONTENT[skill][n-1] || null; }
function sectionSubRec(skill, n){
  const d = sectionSubDef(skill, n);
  return d ? S.test[skill][d.id] : null;
}
/* ¿Ya se envió esta habilidad dentro de la sección? */
function sectionSkillSubmitted(skill, n){
  const r = sectionSubRec(skill, n);
  return !!(r && r.completed);
}
/* Resultado del filtro de una habilidad autocalificada:
   'pending' (sin enviar) | 'pass' | 'fail'. Writing/Speaking → 'n/a'. */
function sectionSkillGate(skill, n){
  if(!AUTOGRADED_SKILLS.includes(skill)) return 'n/a';
  const r = sectionSubRec(skill, n);
  if(!r || !r.completed) return 'pending';
  return r.raPass===false ? 'fail' : 'pass';
}
/* Writing y Speaking quedan BLOQUEADOS en una sección donde Reading o
   Listening no alcanzó el mínimo (si ya se habían enviado antes, siguen
   visibles pero no cuentan como pendientes). */
function sectionSkillLocked(skill, n){
  return !AUTOGRADED_SKILLS.includes(skill) && sectionStopped(n) && !sectionSkillSubmitted(skill, n);
}
/* Habilidades que el estudiante debe enviar en la sección (las no bloqueadas). */
function sectionRequiredSkills(n){
  return SECTION_SKILL_ORDER.filter(sk => !sectionSkillLocked(sk, n));
}
/* Todas las habilidades requeridas de la sección ya fueron enviadas. */
function sectionSubmittedAll(n){
  return sectionRequiredSkills(n).every(sk => sectionSkillSubmitted(sk, n));
}
/* Reading y Listening enviados y con el mínimo en todos los RA de la sección. */
function sectionPassed(n){
  return AUTOGRADED_SKILLS.every(sk => sectionSkillGate(sk, n)==='pass');
}
/* Stop Rule: Reading o Listening enviado sin alcanzar el mínimo. */
function sectionStopped(n){
  return AUTOGRADED_SKILLS.some(sk => sectionSkillGate(sk, n)==='fail');
}
/* La sección 1 se abre tras la presentación; las siguientes exigen que la
   anterior esté aprobada (Reading+Listening) y con las 4 habilidades enviadas.
   Si la anterior falló, TODA la sección (las 4 habilidades) queda bloqueada. */
function sectionUnlocked(n){
  if(n===1) return !!S.test.presentationSeen;
  return sectionUnlocked(n-1) && sectionPassed(n-1) && sectionSubmittedAll(n-1);
}
/* Sección cerrada: todas sus habilidades enviadas. */
function sectionCompleted(n){ return sectionSubmittedAll(n); }
/* Estado para mostrar en menú/stepper:
   locked | stopped_before (bloqueada por Stop Rule previa) | available | in_progress | done */
function sectionState(n){
  if(!sectionUnlocked(n)){
    for(let k=n-1;k>=1;k--) if(sectionStopped(k)) return 'stopped_before';
    return 'locked';
  }
  if(sectionSubmittedAll(n)) return 'done';
  const any = SECTION_SKILL_ORDER.some(sk => sectionSkillSubmitted(sk, n));
  return any ? 'in_progress' : 'available';
}
/* Última sección alcanzable por el estudiante (donde termina su recorrido). */
function lastReachedSection(){
  let last = 0;
  SECTION_ORDER.forEach(n=>{ if(sectionUnlocked(n)) last = n; });
  return last;
}
/* Sección a mostrar al entrar/continuar: la primera abierta que no esté
   cerrada; si todas las abiertas están cerradas, la última alcanzada. */
function defaultSection(){
  const open = SECTION_ORDER.find(n => sectionUnlocked(n) && !sectionSubmittedAll(n));
  return open || Math.max(1, lastReachedSection());
}
/* El recorrido terminó: la última sección alcanzada está cerrada y no hay
   una siguiente que se pueda abrir (Stop Rule o Sección 3 completada). */
function testEnded(){
  const n = lastReachedSection();
  if(n===0 || !sectionSubmittedAll(n)) return false;
  return n===SECTION_ORDER[SECTION_ORDER.length-1] || sectionStopped(n);
}
/* Parte 11 · Paso 5: progreso y estado medidos POR SECCIÓN.
   Secciones "en juego": hasta la primera sección donde se activó el Stop Rule
   (esa es la última que el estudiante hará); si no hay Stop Rule, las 3.
   Así, quien se detiene en la Sección 1 llega al 100% con solo 4 envíos. */
function plannedSections(){
  const stop = SECTION_ORDER.find(sectionStopped);
  return stop ? SECTION_ORDER.filter(n => n<=stop) : SECTION_ORDER.slice();
}
function overallProgress(){
  const secs = plannedSections();
  let total = 0, done = 0;
  secs.forEach(n => sectionRequiredSkills(n).forEach(sk => { total++; if(sectionSkillSubmitted(sk, n)) done++; }));
  return Math.round(done/total*100);
}
/* Secciones que el estudiante realmente alcanzó (abiertas). */
function reachedSections(){ return SECTION_ORDER.filter(sectionUnlocked); }
function computeStatus(){
  const t = S.test;
  if(!t.presentationSeen) return 'not_started';
  if(!testEnded()) return 'in_progress';
  // Solo se exige calificación docente en las secciones alcanzadas.
  if(!allGradedFor(t)) return 'pending_evaluation';
  return t.status === 'finalized' ? 'finalized' : 'completed';
}
/* Parte 11 · Paso 6: versiones "de otro estudiante" (panel docente). Las
   funciones de sección leen S.test, así que se evalúan con withTest(), que
   lo cambia un instante y siempre lo restaura. */
function withTest(t, fn){
  const prev = S.test; S.test = t;
  try{ return fn(); } finally{ S.test = prev; }
}
/* Writing y Speaking calificados en TODAS las secciones alcanzadas. */
function allGradedFor(t){
  return withTest(t, ()=> reachedSections().every(n =>
    ['writing','speaking'].every(sk=>{
      const r = sectionSubRec(sk, n);
      if(!r || !r.completed) return true;   // bloqueado o no enviado: nada que calificar
      return r.teacherScore!==null && r.teacherScore!==undefined;
    })));
}
function computeStatusFor(t){ return withTest(t, computeStatus); }
function overallProgressFor(t){ return withTest(t, overallProgress); }
/* Resumen por sección para el reporte del estudiante y del docente. */
function sectionSummaryFor(t){
  return withTest(t, ()=> SECTION_ORDER.map(n=>{
    const unlocked = sectionUnlocked(n);
    const stoppedHere = sectionStopped(n);
    const prevStop = SECTION_ORDER.find(k => k<n && sectionStopped(k));
    const sent = sectionRequiredSkills(n).filter(sk => sectionSkillSubmitted(sk, n)).length;
    const required = sectionRequiredSkills(n).length;
    let text, tone;
    if(!unlocked){
      text = prevStop ? `No alcanzada · la prueba se detuvo en la Sección ${prevStop}` : 'No alcanzada';
      tone = 'locked';
    } else if(stoppedHere){
      text = 'Reading y/o Listening por debajo del mínimo · Writing y Speaking bloqueados · la prueba se detuvo aquí'; tone = 'stopped';
    } else if(sectionPassed(n)){
      text = 'Reading y Listening: mínimo alcanzado'; tone = 'done';
    } else {
      text = 'En curso'; tone = 'active';
    }
    return {n, unlocked, stopped:stoppedHere, sent, required, text, tone, ras:SECTION_META[n].ras};
  }));
}
/* Texto corto de avance para la tabla del docente. */
function sectionProgressLabelFor(t){
  if(!t.presentationSeen) return '—';
  return withTest(t, ()=>{
    const last = lastReachedSection();
    if(testEnded()) return sectionStopped(last) ? `Detenido en Sección ${last}` : 'Completó las 3 secciones';
    return `En Sección ${last}`;
  });
}
/* Celda "aciertos/total" de un RA en una habilidad (raDetail().skills[sk]). */
function raSkillCellHtml(g){
  if(!g || !g.attempted) return '<span style="color:var(--muted)">—</span>';
  if(g.pending) return '<span class="badge badge-pending">Pendiente</span>';
  return `${g.a}/${g.n} <span title="Mínimo ${g.min}/8" style="color:${g.pass?'var(--success,#2e7d32)':'var(--danger,#c0392b)'}">${g.pass?'✓':'✗'}</span>`;
}
function renderSectionSummaryCard(t){
  const sums = sectionSummaryFor(t);
  return `<div class="card">
    <h3>Recorrido por secciones</h3>
    <table class="table">
      <thead><tr><th>Sección</th><th>RA</th><th>Habilidades enviadas</th><th>Estado</th></tr></thead>
      <tbody>${sums.map(x=>`<tr>
        <td><b>${SECTION_META[x.n].label}</b></td>
        <td>${x.ras.join(' · ')}</td>
        <td>${x.unlocked ? `${x.sent} de ${x.required}` : '—'}</td>
        <td>${x.text}</td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`;
}
const STATUS_LABEL = {
  not_started:'Not started', in_progress:'In progress', pending_evaluation:'Pending evaluation',
  completed:'Completed', finalized:'Finalized',
};

/* Devuelve la lista de RA únicos presentes en un array de preguntas o de
   ítems de checklist (cada uno con su propio campo `ra`). Se usa solo para
   mostrar chips informativos — nunca como fuente de verdad para puntuar. */
function uniqueRAs(items){
  return [...new Set(items.map(it=>it.ra))];
}
/* Par de RA que cubre una subsección (p.ej. "RA1 · RA2"), para mostrar en
   encabezados. Cada sección ahora agrupa contenido de dos RA fijos. */
function raPairLabel(def){
  const items = def.questions || def.checklist;
  return uniqueRAs(items).join(' · ');
}

/* Scoring */
/* Normaliza una respuesta de texto libre para compararla de forma tolerante
   (mayúsculas, espacios extra, puntuación simple) sin exigir coincidencia
   carácter por carácter. */
function normalizeAnswer(s){
  return (s||'').toString().trim().toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ');
}
/* Corrección genérica de una pregunta de reading/listening, sea de opción
   múltiple (compara índices) o de texto libre tipo "Data Sheet" (compara
   contra la respuesta esperada y sus variantes aceptadas en `accepted`). */
function isCorrectAnswer(q, given, all){
  if(q.type==='text'){
    const norm = normalizeAnswer(given);
    if(!norm) return false;
    const accepted = (q.accepted && q.accepted.length ? q.accepted : [q.answer]).map(normalizeAnswer);
    return accepted.includes(norm);
  }
  if(q.type==='bank'){
    // Completación con banco de palabras: la palabra debe estar en `accepted`
    // y, si `differsFrom` existe, no repetir la respuesta de ese otro hueco
    // (huecos intercambiables como then / after that).
    const norm = normalizeAnswer(given);
    if(!norm) return false;
    if(!q.accepted.map(normalizeAnswer).includes(norm)) return false;
    if(q.differsFrom!==undefined && all && normalizeAnswer(all[q.differsFrom])===norm) return false;
    return true;
  }
  if(q.type==='order'){
    if(!Array.isArray(given) || given.length!==q.correctOrder.length) return false;
    return given.every((v,idx)=>v===q.correctOrder[idx]);
  }
  if(q.type==='match'){
    return !!given && given===q.correct;
  }
  return given===q.correct;
}
/* Puntos de una pregunta: {a: obtenidos, n: posibles}. Casi todas valen 1.
   Una pregunta type:'order' con partial:true (ordenamiento cronológico del
   PDF: 8 eventos = 8 ítems) vale un punto por cada posición correcta. */
function questionPoints(q, given, all){
  if(q.type==='order' && q.partial){
    const n = q.correctOrder.length;
    if(!Array.isArray(given) || given.length!==n) return {a:0, n};
    return {a: given.reduce((acc,v,idx)=> acc + (v===q.correctOrder[idx] ? 1 : 0), 0), n};
  }
  return {a: isCorrectAnswer(q, given, all) ? 1 : 0, n: 1};
}
function readingListeningScore(skill, subId){
  const def = CONTENT[skill].find(s=>s.id===subId);
  const rec = S.test[skill][subId];
  let a=0, n=0;
  def.questions.forEach((q,i)=>{ const pt = questionPoints(q, rec.answers[i], rec.answers); a+=pt.a; n+=pt.n; });
  return n ? Math.round(a/n*100) : 0;
}
function skillAverage(skill){
  const subs = CONTENT[skill];
  let scores = [];
  subs.forEach(s=>{
    const rec = S.test[skill][s.id];
    if(skill==='reading'||skill==='listening'){
      if(rec.completed) scores.push(rec.score);
    } else if(skill==='writing'){
      if(rec.teacherScore!==null && rec.teacherScore!==undefined) scores.push(rec.teacherScore);
      else if(rec.completed) scores.push(rec.aiLevelScore||0);
    } else if(skill==='speaking'){
      if(rec.teacherScore!==null && rec.teacherScore!==undefined) scores.push(rec.teacherScore);
    }
  });
  if(!scores.length) return null;
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}
function scoreToLevel(pct){
  if(pct===null) return '—';
  if(pct>=85) return 'B2';
  if(pct>=70) return 'B1';
  if(pct>=50) return 'A2';
  return 'A1';
}
/* RA detail: for a given test record, work out per-RA performance and status.
   status: 'passed' | 'failed' | 'pending' (waiting on teacher evaluation) | 'not_attempted'

   IMPORTANTE — cada RA se mide de forma completamente independiente:
   en vez de copiar el score de toda la subsección a cada RA que aparecía
   en su etiqueta (arquitectura anterior), aquí se agrupan solo las
   preguntas (reading/listening) o ítems del checklist (writing/speaking)
   que están etiquetados con ese RA específico, y se calcula el % de
   aciertos únicamente sobre ese subconjunto. Una subsección puede así
   "aprobar" un RA y "reprobar" otro dentro de la misma actividad. */
function raDetail(t){
  t = t || S.test;
  /* Por RA y por habilidad se acumulan aciertos (a) y total (n). Un RA queda
     aprobado solo si LAS 4 habilidades alcanzan su mínimo (regla AND del PDF). */
  const info = {};
  RA_ORDER.forEach(ra=>{
    info[ra] = {};
    SKILL_ORDER.forEach(sk=> info[ra][sk] = {a:0,n:0,attempted:false,pending:false});
  });

  /* Reading & Listening: auto-corregidas pregunta por pregunta. */
  ['reading','listening'].forEach(skill=>{
    CONTENT[skill].forEach(s=>{
      const rec = t[skill][s.id];
      if(!rec.completed) return;
      s.questions.forEach((q,i)=>{
        const g = info[q.ra] && info[q.ra][skill];
        if(!g) return;
        const pt = questionPoints(q, rec.answers[i], rec.answers);
        g.attempted = true; g.n += pt.n; g.a += pt.a;
      });
    });
  });

  /* Writing & Speaking: cada ítem del checklist tiene su RA. Mientras no
     haya calificación (teacherScore null) el RA queda "pending" en esa
     habilidad. */
  ['writing','speaking'].forEach(skill=>{
    CONTENT[skill].forEach(s=>{
      const rec = t[skill][s.id];
      const attemptedSub = skill==='writing' ? rec.submitted : rec.completed;
      if(!attemptedSub) return;
      const reviewed = rec.teacherScore!==null && rec.teacherScore!==undefined;
      s.checklist.forEach((c,i)=>{
        const g = info[c.ra] && info[c.ra][skill];
        if(!g) return;
        g.attempted = true;
        if(!reviewed){ g.pending = true; return; }
        g.n++;
        const key = skill==='writing' ? c.k : i;
        if(rec.teacherChecklist[key]) g.a++;
      });
    });
  });

  const out = {};
  RA_ORDER.forEach(ra=>{
    // RA6 no se evalúa: se certifica automáticamente con RA5 (mismo status).
    if(ra==='RA6'){ out['RA6'] = {...out['RA5']}; return; }
    const skills = {};
    let attemptedAny=false, anyPending=false, anyFail=false, allPass=true, sumA=0, sumN=0;
    SKILL_ORDER.forEach(sk=>{
      const g = info[ra][sk];
      const pass = !g.pending && g.attempted && passesRA(ra, sk, g.a, g.n);
      skills[sk] = {a:g.a, n:g.n, min:raMin(ra, sk), attempted:g.attempted, pending:g.pending, pass};
      if(g.attempted) attemptedAny = true;
      if(g.pending) anyPending = true;
      if(g.attempted && !g.pending && !pass) anyFail = true;
      if(!pass) allPass = false;
      sumA += g.a; sumN += g.n;
    });
    const pct = sumN ? Math.round(sumA/sumN*100) : null; // referencial
    let status;
    if(!attemptedAny) status = 'not_attempted';
    else if(anyFail) status = 'failed';
    else if(allPass) status = 'passed';
    else if(anyPending) status = 'pending';
    else status = 'not_attempted'; // faltan habilidades por presentar
    out[ra] = {pct, status, skills};
  });
  return out;
}

/* Cumulative RA1→RA6 certification: certifies RA1, RA2... in order and stops
   at the first RA that is not passed (failed, pending, or not attempted). */
function certificationSummary(t){
  const detail = raDetail(t);
  let certified = [], stopRA=null, stopReason=null;
  for(const ra of RA_ORDER){
    if(detail[ra].status==='passed'){ certified.push(ra); continue; }
    stopRA = ra; stopReason = detail[ra].status; break;
  }
  return {certified, stopRA, stopReason, detail};
}
function raPlacementLabel(t){
  const c = certificationSummary(t);
  return c.certified.length ? c.certified[c.certified.length-1] : '—';
}

/* Simple heuristic "AI" writing analysis — placeholder for a real model call.
   Kept isolated so it can later be swapped for a real API integration
   (see section "AI evaluation architecture" in the functional spec). */
function aiAnalyzeWriting(taskId, text){
  const def = CONTENT.writing.find(w=>w.id===taskId);
  const lower = (text||'').toLowerCase();
  const results = {};
  def.checklist.forEach(item=>{
    results[item.k] = item.kw.some(k => lower.includes(k));
  });
  const hitCount = Object.values(results).filter(Boolean).length;
  const pct = Math.round(hitCount/def.checklist.length*100);
  const wc = wordCount(text);
  const [lo,hi] = def.wordRange;
  const lengthOk = wc>=lo*0.7;
  // El nivel ya no viene fijo por sección (las secciones ahora se organizan
  // por pares de RA, no por CEFR): se infiere puramente del desempeño en
  // este intento — cobertura del checklist y longitud del texto.
  let level = scoreToLevel(pct);
  if(!lengthOk) level = 'A1';
  return {checklist:results, coveragePct:pct, suggestedLevel:level, wordCount:wc, lengthOk};
}

function renderKeepScroll(){
  const els = [document.scrollingElement, ...document.querySelectorAll('.main, .main-inner, .rs-questions-col, .rs-passage-col, .content')].filter(Boolean);

}

/* Bloque de una pregunta de reading/listening. Soporta dos tipos:
   - opción múltiple (radio buttons, comparación por índice)
   - texto libre tipo "Data Sheet" (input de texto, corrección tolerante
     vía isCorrectAnswer/normalizeAnswer contra `answer`/`accepted`)
   `kind` es 'read' o 'listen', y decide los atributos data-* usados por
   el wiring de eventos correspondiente. */
function renderRLQuestion(def, rec, q, i, done, kind, displayNum){
  const raBadge = `<span class="ra-tag">${q.ra}</span>`;
  const anchorId = `qanchor-${kind}-${def.id}-${i}`;
  const num = displayNum!==undefined ? displayNum : i+1;
  if(q.type==='text'){
    const given = rec.answers[i]!==undefined ? rec.answers[i] : '';
    const safeVal = (given||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `
      <div class="q-block" id="${anchorId}">
        <span class="q-num">${raBadge} Question ${num}</span>
        <div class="q-text">${q.q}</div>
        <input type="text" class="text-answer-input" value="${safeVal}" ${done?'disabled':''} placeholder="${kind==='listen' ? 'Type the exact word or phrase you heard...' : (q.ra==='RA3' ? 'Write the correct short answer...' : 'Type the exact information from the text...')}" data-${kind}-text-answer="${def.id}|${i}">
      </div>`;
  }
  if(q.type==='bank'){
    const given = rec.answers[i]!==undefined ? rec.answers[i] : '';
    return `
      <div class="q-block" id="${anchorId}">
        <span class="q-num">${raBadge} Question ${num}</span>
        <div class="q-text">${q.q}</div>
        <select class="text-answer-input" ${done?'disabled':''} data-${kind}-text-answer="${def.id}|${i}">
          <option value="">— Elige una palabra del banco —</option>
          ${q.opts.map(o=>`<option value="${o}" ${given===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>`;
  }
  if(q.type==='match'){
    const given = rec.answers[i]!==undefined ? rec.answers[i] : '';
    return `
      <div class="q-block" id="${anchorId}">
        <span class="q-num">${raBadge} Question ${num}</span>
        <div class="q-text">${q.q}</div>
        <select class="text-answer-input" ${done?'disabled':''} data-${kind}-text-answer="${def.id}|${i}">
          <option value="">— Elige la letra correcta —</option>
          ${q.options.map(o=>`<option value="${o.letter}" ${given===o.letter?'selected':''}>${o.letter}) ${o.text}</option>`).join('')}
        </select>
      </div>`;
  }
  if(q.type==='order'){
    const order = Array.isArray(rec.answers[i]) ? rec.answers[i] : q.items.map((_,idx)=>idx);
    return `
      <div class="q-block" id="${anchorId}">
        <ol class="order-list" data-order-list="${kind}|${def.id}|${i}">
          ${order.map((itemIdx,pos)=>{
            let cls='order-item';
            return `<li class="${cls}" draggable="${done?'false':'true'}" data-order-pos="${pos}">
              <span class="order-drag-handle">${ICONS.drag||'⠿'}</span>
              <span class="order-item-num">${pos+1}</span>
              <span class="order-item-text">${q.items[itemIdx]}</span>
            </li>`;
          }).join('')}
        </ol>
      </div>`;
  }
  return `
    <div class="q-block" id="${anchorId}">
      <span class="q-num">${raBadge} Question ${num}</span>
      <div class="q-text">${q.q}</div>
      <div class="opt-list">
        ${q.opts.map((o,oi)=>{
          let cls='opt';
          return `<label class="${cls}"><input type="radio" name="${def.id}-q${i}" value="${oi}" ${rec.answers[i]===oi?'checked':''} ${done?'disabled':''} data-${kind}-answer="${def.id}|${i}"> ${o}</label>`;
        }).join('')}
      </div>
    </div>`;
}

/* Índice compacto de preguntas: muestra solo el enunciado de cada
   pregunta (sin opciones) y, al hacer clic, abre un modal con esa
   pregunta completa (renderRLQuestion) para responderla.
   `activeRA` filtra qué preguntas se listan (Section 1 = RA1, Section 2 = RA2, ...). */
/* Preguntas que se responden directamente en la página (no en el panel):
   ordenar frases y completar huecos arrastrando palabras al texto. */
function isInlineQuestion(q){ return q.type==='order' || q.type==='bank'; }

/* ---- Huecos con banco de palabras arrastrable (Reading, type:'bank') ---- */
function gapPassage(def){ return (def.passages||[]).find(x=>x.wordBank) || null; }
/* {nº de hueco → índice de pregunta}, según el enunciado "Gap (n): ..." */
function gapQuestionMap(def){
  const m = {};
  def.questions.forEach((q,i)=>{ if(q.type==='bank'){ const g=/^Gap \((\d+)\)/.exec(q.q); if(g) m[parseInt(g[1])]=i; } });
  return m;
}
function gapUsedCount(def, rec, word, exceptQi){
  return Object.values(gapQuestionMap(def)).filter(qi => qi!==exceptQi && rec.answers[qi]===word).length;
}
function renderGapBank(def, rec, ps){
  const used = {};
  Object.values(gapQuestionMap(def)).forEach(qi=>{ const w=rec.answers[qi]; if(w) used[w]=(used[w]||0)+1; });
  const left = {...used};
  const chips = ps.wordBank.map((w,idx)=>{
    const isUsed = left[w]>0; if(isUsed) left[w]--;
    const sel = S.gapSel && S.gapSel.subId===def.id && S.gapSel.word===w && !isUsed;
    return `<span class="gap-chip ${isUsed?'used':''} ${sel?'selected':''}" ${(!isUsed && !rec.completed)?`data-gap-chip="${def.id}|${w}"`:''}>${w}</span>`;
  }).join('');
  return `<div class="gap-bank" data-gap-bank="${def.id}"><span class="gap-bank-title">Word bank</span>${chips}</div>`;
}
function renderGapText(def, rec, ps){
  const map = gapQuestionMap(def);
  return ps.text.split(/\n\s*\n/).map(par=>{
    const html = par.trim().replace(/\((\d+)\)\s*_{2,}/g, (m,n)=>{
      const qi = map[parseInt(n)];
      const w = rec.answers[qi];
      const attrs = rec.completed ? '' : `data-gap-slot="${def.id}|${qi}"`;
      return `<span class="gap-slot ${w?'filled':''}" ${attrs}><span class="gap-num">(${n})</span>${w
        ? `<span class="gap-word" ${rec.completed?'':`data-gap-word="${def.id}|${qi}"`}>${w}</span>`
        : '<span class="gap-blank">&nbsp;</span>'}</span>`;
    });
    return `<p>${html}</p>`;
  }).join('');
}
function renderGapProgress(def, rec, activeRA){
  const qis = def.questions.map((q,i)=>i).filter(i=>def.questions[i].ra===activeRA && def.questions[i].type==='bank');
  const filled = qis.filter(i=>rec.answers[i]).length;
  return `<div class="gap-progress"><b>${filled} / ${qis.length}</b> espacios completados</div>`;
}
function renderQIndex(def, rec, kind, activeRA){
  return `
    <div class="q-index-list">
      ${def.questions.map((q,i)=>({q,i})).filter(({q})=>q.ra===activeRA).map(({q,i},pos)=>{
        // Ordenar frases: se muestran directamente en la página, sin abrir panel.
        if(q.type==='bank') return pos===0 ? renderGapBank(def, rec, gapPassage(def)) + renderGapProgress(def, rec, activeRA) : '';
        if(isInlineQuestion(q)) return `<div class="q-inline">${renderRLQuestion(def, rec, q, i, rec.completed, kind, pos+1)}</div>`;
        const answered = rec.answers[i]!==undefined && rec.answers[i]!==null && rec.answers[i]!=='';
        return `<button type="button" class="q-index-item ${answered?'answered':''}" data-q-modal-open="${kind}|${def.id}|${i}">
          <span class="q-index-num">${pos+1}</span>
          <span class="q-index-text">${q.q}</span>
          ${answered ? ICONS.check : ''}
        </button>`;
      }).join('') || `<p style="color:var(--muted);font-size:.85rem;padding:6px 2px">Aún no hay preguntas en esta sección.</p>`}
    </div>`;
}

/* Etiqueta de "Sección" según el RA de la pregunta (RA impar → Section 1, RA par → Section 2
   dentro de cada par de la subsección). Se usa tanto en los botones de sección como en el modal. */
const SECTION_LABELS = {RA1:'Task 1 · RA1', RA2:'Task 1 · RA2', RA3:'Task 2 · RA3', RA4:'Task 1 · RA4', RA5:'Task 2 · RA5', RA6:'RA6'};

/* Botones Section 1 / Section 2 (... por cada RA presente en el set de preguntas)
   que controlan qué bloque de RA se muestra en el índice y en la lista completa. */
function renderSectionToggle(def, kind, activeRA){
  const ras = uniqueRAs(def.questions);
  return `
    <div class="section-toggle">
      ${ras.map(ra=>`<button type="button" class="section-toggle-btn ${activeRA===ra?'active':''}" data-section-select="${kind}|${def.id}|${ra}">${SECTION_LABELS[ra]||ra}</button>`).join('')}
    </div>`;
}

/* Panel de la pregunta activa (S.qModal), mostrado DENTRO de la columna derecha
   (mismo ancho/posición que el índice), para que el texto de la izquierda
   siga siendo visible. Incluye navegación Anterior/Siguiente dentro de la
   misma sección (RA) y un botón para volver al listado. */
function renderQFocusPanel(def, rec, kind, qi){
  const q = def.questions[qi];
  if(!q) return '';
  const done = rec.completed;
  const sameRA = def.questions.map((qq,i)=>i).filter(i=>def.questions[i].ra===q.ra && !isInlineQuestion(def.questions[i]));
  const pos = sameRA.indexOf(qi);
  // Recorrido completo (todas las tareas/RA en orden): Anterior/Siguiente cruzan de una tarea a la otra.
  const order = uniqueRAs(def.questions).flatMap(ra => def.questions.map((qq,i)=>i).filter(i=>def.questions[i].ra===ra && !isInlineQuestion(def.questions[i])));
  const oi = order.indexOf(qi);
  const prevQi = oi>0 ? order[oi-1] : null;
  const nextQi = oi<order.length-1 ? order[oi+1] : null;
  return `
  <div class="card q-focus-overlay">
    <div class="q-focus-header">
      <span class="ra-tag">${SECTION_LABELS[q.ra]||q.ra}</span>
      <button type="button" class="modal-close" id="q-focus-close" aria-label="Cerrar">×</button>
    </div>
    <div class="q-focus-overlay-body">
      ${renderRLQuestion(def, rec, q, qi, done, kind, pos+1)}
    </div>
    <div class="q-focus-footer">
      <button type="button" class="btn btn-outline" data-modal-nav="${prevQi!==null?prevQi:''}" ${prevQi===null?'disabled':''}>${ICONS.chevLeft} Anterior</button>
      <span class="modal-progress">${pos+1} / ${sameRA.length}</span>
      ${nextQi!==null
        ? `<button type="button" class="btn btn-outline" data-modal-nav="${nextQi}">Siguiente ${ICONS.chevRight}</button>`
        : `<button type="button" class="btn btn-outline" data-modal-nav="close">Terminar ${ICONS.check}</button>`}
    </div>
  </div>`;
}

/* ---- RESULTS ---- */
/* Familias de temas: agrupa las variantes de `focus` (p. ej. "Reported Speech
   Past", "Reported speech formal") bajo un solo nombre para no repetir temas. */
const TOPIC_FAMILIES = [
  [/third conditional/i,'Third Conditional'],
  [/second conditional/i,'Second Conditional'],
  [/first conditional/i,'First Conditional'],
  [/zero conditional/i,'Zero Conditional'],
  [/pasiv|passive/i,'Passive Voice'],
  [/reported speech/i,'Reported Speech'],
  [/past modal/i,'Past Modals (should have / could have)'],
  [/relative clause/i,'Relative Clauses'],
  [/phrasal/i,'Phrasal Verbs'],
  [/conector(es)?\s+de secuencia|sequence connectors/i,'Sequence Connectors'],
  [/causa|cause/i,'Cause & Effect Connectors'],
  [/concesi|contraste/i,'Contrast & Concession Connectors'],
  [/present perfect continuous/i,'Present Perfect Continuous'],
  [/present perfect/i,'Present Perfect'],
  [/present continuous/i,'Present Continuous'],
  [/present simple/i,'Present Simple'],
  [/past continuous/i,'Past Continuous'],
  [/simple past/i,'Simple Past'],
  [/comparativ/i,'Comparatives'],
  [/going to/i,'Going to (future)'],
  [/should|advice/i,'Modals of Advice (should)'],
  [/must|have to|obligaci|formal requirements/i,'Modals of Obligation (must / have to)'],
  [/imperativ/i,'Imperatives & Wh-Questions'],
  [/preposition/i,'Prepositions of Place'],
  [/to be/i,'Verb To Be / Personal Data'],
  [/inferencia/i,'Lexical Inference'],
];
function topicFamily(focus){
  const clean = focus.replace(/^RA\d+\.\d+\s—\s/,'').replace(/\s*\((?:Long|Short) Answer\)\s*$/,'');
  const hit = TOPIC_FAMILIES.find(f=>f[0].test(clean));
  return hit ? hit[1] : clean.replace(/\s*\([^)]*\)/g,'').trim();
}
/* Desempeño por tema (Reading y Listening, autocalificados). Cada tema aparece
   una sola vez, sumando los aciertos de todas sus preguntas (a = aciertos,
   n = ítems evaluados). Fortaleza: >= 70 % de aciertos; si no, área de mejora. */
const TOPIC_STRENGTH_MIN = 0.7;
function topicPerformance(t){
  t = t || S.test;
  const map = {};
  ['reading','listening'].forEach(skill=>{
    CONTENT[skill].forEach(sub=>{
      const rec = t[skill][sub.id];
      if(!rec.completed) return;
      sub.questions.forEach((q,i)=>{
        if(!q.focus) return;
        const topic = topicFamily(q.focus);
        const pt = questionPoints(q, rec.answers[i], rec.answers);
        const m = map[topic] || (map[topic] = {topic, ras:new Set(), a:0, n:0});
        m.ras.add(q.ra); m.a += pt.a; m.n += pt.n;
      });
    });
  });
  const all = Object.values(map).map(x=>({...x, ras:[...x.ras].sort()}));
  return {
    strengths: all.filter(x=>x.a/x.n >= TOPIC_STRENGTH_MIN).sort((x,y)=>(y.a/y.n)-(x.a/x.n)),
    weaknesses: all.filter(x=>x.a/x.n < TOPIC_STRENGTH_MIN).sort((x,y)=>(x.a/x.n)-(y.a/y.n)),
  };
}
function topicItemHtml(x, icon){
  return `<li>${icon}<span><b>${x.ras.join(' · ')}</b> — ${x.topic}</span></li>`;
}
/* Estado de una habilidad dentro de un RA (a partir de raDetail().skills[sk]). */
function raSkillStatus(g){
  if(!g || !g.attempted) return {cls:'badge-locked', text:'No evaluado'};
  if(g.pending) return {cls:'badge-pending', text:'Pendiente'};
  if(g.pass) return {cls:'badge-done', text:'Superado'};
  return {cls:'badge-locked', text:'No superado'};
}
/* Bloque de un RA: código + CEFR, título completo, insignia del RA y una barra
   por habilidad (solo con los datos de esa habilidad en ese RA). RA6 se
   certifica con RA5, así que no repite las barras de RA5. */
function renderRABlock(k, cert){
  const d = cert.detail[k];
  let pillClass = 'badge-locked', pillText='No evaluado';
  if(d.status==='passed'){ pillClass='badge-done'; pillText='Certificado'; }
  else if(d.status==='pending'){ pillClass='badge-pending'; pillText='Pendiente'; }
  else if(d.status==='failed'){ pillClass='badge-locked'; pillText='No superado'; }
  const cefr = raCefrLabel(k);
  const rows = k==='RA6' ? '' : SKILL_ORDER.map(sk=>{
    const g = d.skills[sk];
    const st = raSkillStatus(g);
    const pct = g && g.n ? Math.round(g.a/g.n*100) : null;
    const tip = g && g.n ? `${g.a}/${g.n} aciertos · mínimo ${g.min}/${g.n}` : '';
    return `<div class="ra-skill-row">
      <div class="ra-skill-name">${SKILL_META[sk].label}</div>
      <div class="ra-bar-track"><div class="ra-bar-fill" style="width:${pct||0}%;${g && g.pass ? '' : 'background:var(--locked)'}"></div></div>
      <div class="ra-bar-pct">${pct!==null ? pct+'%' : '—'}</div>
      <div class="ra-skill-badge"><span class="badge ${st.cls}" title="${tip}">${st.text}</span></div>
    </div>`;
  }).join('');
  return `<div class="ra-block">
    <div class="ra-head"><div class="ra-code">${k}${cefr?` · ${cefr}`:''}</div><span class="badge ${pillClass}">${pillText}</span></div>
    <div class="ra-title">${RA_TITLES[k]}</div>
    ${k==='RA6' ? '<div style="font-size:.8rem;color:var(--muted)">Se certifica automáticamente al aprobar RA5.</div>' : rows}
  </div>`;
}
/* Recorrido por secciones + Resultados de Aprendizaje en una sola tarjeta:
   cada sección muestra su estado y, debajo, los RA que evalúa. */
function renderJourneyCard(t, cert){
  const sums = sectionSummaryFor(t);
  const covered = sums.flatMap(x=>x.ras);
  const rest = RA_ORDER.filter(k=>!covered.includes(k));
  return `<div class="card">
    <h3>Desempeño por Resultado de Aprendizaje</h3>
    ${sums.map(x=>`<div class="journey-sec">
      <div class="journey-head"><b>${SECTION_META[x.n].label}</b>${x.unlocked ? `<span>${x.sent} de ${x.required} habilidades enviadas</span>` : ''}</div>
      ${x.ras.map(k=>renderRABlock(k, cert)).join('')}
    </div>`).join('')}
    ${rest.length ? `<div class="journey-sec">
      <div class="journey-head"><b>Cierre del programa</b></div>
      ${rest.map(k=>renderRABlock(k, cert)).join('')}
    </div>` : ''}
  </div>`;
}
function renderResults(){
  if(!testEnded()){
    return `<div class="locked-panel">${ICONS.lock}<h3 style="margin-bottom:8px;color:var(--ink)">Resultados no disponibles todavía</h3><p>Termina las cuatro habilidades de tu sección actual (y las siguientes, si la prueba continúa) para ver tu reporte.</p></div>`;
  }
  const cert = certificationSummary(S.test);
  const pending = computeStatus()==='pending_evaluation';

  // Secondary CEFR reference (not the main verdict, just contextual info)
  const skillScores = {};
  SKILL_ORDER.forEach(sk => skillScores[sk] = skillAverage(sk));

  const topics = topicPerformance(S.test);

  let verdictTitle, verdictSub, verdictNote;
  if(cert.certified.length===0){
    verdictTitle = 'Sin Competencias Certificadas';
    verdictSub = 'Ubicación Final: RA1 (A1.1 / A1.2; incluye aprendices Pre-A1).';
  } else {
    const last = cert.certified[cert.certified.length-1];
    verdictTitle = raLabelWithCefr(last);
    verdictSub = last==='RA6'
      ? 'Suficiencia Total del Programa — RA6 Aprobado (certifica RA1 a RA5).'
      : `Ubicación Final: ${raLabelWithCefr(last)}.`;
  }
  if(cert.stopReason==='pending') verdictNote = `${raLabelWithCefr(cert.stopRA)} pendiente de evaluación docente (Writing y/o Speaking) para confirmar la ubicación.`;
  else if(cert.stopReason==='failed') verdictNote = `No se alcanzó el mínimo requerido en al menos una de las 4 habilidades de ${raLabelWithCefr(cert.stopRA)} (${raMinSummary(cert.stopRA)}).`;
  else if(cert.stopReason==='not_attempted') verdictNote = `${raLabelWithCefr(cert.stopRA)} aún no cuenta con evidencia suficiente en las 4 habilidades.`;
  else verdictNote = 'Todos los Resultados de Aprendizaje fueron certificados (RA1 a RA5).';

  return `
  <h1 class="page-title">Reporte de Resultados</h1>

  <div class="result-hero">
    <div>
      <div style="text-align:center;margin-bottom:18px">
        <span class="eyebrow" style="color:#9FC0E0;display:block;margin-bottom:4px">${S.user.name}</span>
        <div class="level-tag" style="text-align:center">${fmtDate(S.test.startDate)}</div>
      </div>
      <h2>Dictamen de Ubicación de Resultado de Aprendizaje</h2>
      <div class="level-display">${verdictTitle}</div>
      <div class="level-tag">${verdictSub}</div>
      <div class="level-tag" style="margin-top:6px;color:#D9C592">${verdictNote}</div>
    </div>
    <div>
      <h2 style="margin-bottom:10px">Nivel por habilidad según el Marco Común Europeo de Referencia para las Lenguas (CEFR)</h2>
    <div class="skill-grid">
      ${SKILL_ORDER.map(sk=>`<div class="skill-card"><div class="k">${SKILL_META[sk].label}</div><div class="v">${scoreToLevel(skillScores[sk])}</div></div>`).join('')}
    </div>
    </div>
  </div>
  <p class="page-sub" style="margin-top:-8px;font-size:.82rem;max-width:none;width:100%">Los niveles A1–B2 mostrados por habilidad son una referencia complementaria; la ubicación oficial es el Resultado de Aprendizaje certificado arriba.</p>

  ${renderJourneyCard(S.test, cert)}

  <div class="two-col">
    <div class="card">
      <h3>Fortalezas</h3>
      <ul class="tag-list">${topics.strengths.map(x=>topicItemHtml(x, ICONS.check)).join('') || '<li>Aún no hay temas con todas las respuestas correctas.</li>'}</ul>
    </div>
    <div class="card">
      <h3>Áreas de mejora</h3>
      <ul class="tag-list">${topics.weaknesses.map(x=>topicItemHtml(x, ICONS.alert)).join('') || '<li>No hay temas por reforzar.</li>'}</ul>
    </div>
  </div>

  <div class="actions-row no-print">
    <button class="btn btn-outline" id="print-report-btn">Generate Report / Download PDF</button>
  </div>`;
}

function overallForTest(t){
  const scores = [];
  SKILL_ORDER.forEach(sk=>{
    let s=[];
    CONTENT[sk].forEach(d=>{
      const rec = t[sk][d.id];
      if(sk==='reading'||sk==='listening'){ if(rec.completed) s.push(rec.score); }
      else if(sk==='writing'){ if(rec.teacherScore!==null&&rec.teacherScore!==undefined) s.push(rec.teacherScore); }
      else if(sk==='speaking'){ if(rec.teacherScore!==null&&rec.teacherScore!==undefined) s.push(rec.teacherScore); }
    });
    if(s.length) scores.push(s.reduce((a,b)=>a+b,0)/s.length);
  });
  const pct = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  return {pct, level: scoreToLevel(pct)};
}
